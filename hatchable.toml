[auth]
enabled = true
providers = ["email", "google"]

[ai]
required = true
providers = ["google", "openai", "anthropic"]

[[secret]]
key = "GOOGLE_API_KEY"
required = false
expose = false
description = "Legacy Google credential retained for compatibility; active AI access is managed by the Hatchable AI capability."

[project]
name = "RecoverIT"

# Public repository: secrets stay in Hatchable Setup and are never committed.
[db.tables.case_outcome_signals]
read = "own"
write = "own"

[db.tables.escalation_preparations]
read = "own"
write = "own"

[db.tables.payment_monitors]
read = "own"
write = "own"

[db.tables.payment_protection_items]
read = "own"
write = "own"

[db.tables.product_signals]
read = "own"
write = "own"

[db.tables.case_resolution_state]
read = "own"
write = "own"

[[cron]]
path = "/api/jobs/case-monitor"
schedule = "0 * * * *"

[[secret]]
key = "razorpay_webhook_secret"
required = false
expose = false
description = "Razorpay webhook signing secret used to verify provider events."

[[secret]]
key = "RAZORPAY_KEY_ID"
required = false
expose = true
description = "Razorpay API key ID for provider reconciliation and approved refund execution."

[[secret]]
key = "RAZORPAY_KEY_SECRET"
required = false
expose = true
description = "Razorpay API key secret for provider reconciliation and approved refund execution."

[[secret]]
key = "TWILIO_ACCOUNT_SID"
required = false
expose = true
description = "Twilio account SID for optional SMS/WhatsApp delivery."

[[secret]]
key = "TWILIO_AUTH_TOKEN"
required = false
expose = true
description = "Twilio authentication token for optional SMS/WhatsApp delivery."

[[secret]]
key = "TWILIO_SMS_FROM"
required = false
expose = true
description = "Twilio SMS sender identity."

[[secret]]
key = "TWILIO_WHATSAPP_FROM"
required = false
expose = true
description = "Twilio WhatsApp sender identity, normally in whatsapp:+... form."

[[secret]]
key = "AA_BASE_URL"
required = false
expose = true
description = "Authorized Account Aggregator integration base URL."

[[secret]]
key = "AA_CLIENT_ID"
required = false
expose = true
description = "Authorized Account Aggregator FIU client identifier."

[[secret]]
key = "AA_CLIENT_SECRET"
required = false
expose = true
description = "Authorized Account Aggregator FIU client secret."

[[secret]]
key = "RECOVERIT_GEMINI_MODEL"
required = false
expose = true
description = "Optional Gemini model override for document understanding."

[[secret]]
key = "OPENAI_API_KEY"
required = false
expose = false
description = "Optional OpenAI API key used as an independent AI failover provider."

[[secret]]
key = "ANTHROPIC_API_KEY"
required = false
expose = false
description = "Optional Anthropic API key used as an independent AI failover provider."

[[secret]]
key = "RECOVERIT_OPENAI_MODEL"
required = false
expose = true
description = "Optional OpenAI model override."

[[secret]]
key = "RECOVERIT_OPENAI_VISION_MODEL"
required = false
expose = true
description = "Optional OpenAI vision model override."

[[secret]]
key = "RECOVERIT_ANTHROPIC_MODEL"
required = false
expose = true
description = "Optional Anthropic model override."

[[secret]]
key = "RECOVERIT_ANTHROPIC_VISION_MODEL"
required = false
expose = true
description = "Optional Anthropic vision model override." 

[[cron]]
path = "/api/outcomes/learn"
schedule = "0 3 * * *"

[db.tables.recovery_cases]
