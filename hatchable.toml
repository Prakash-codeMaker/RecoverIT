[auth]
enabled = true
providers = ["email", "google"]

[ai]
required = true
providers = ["google"]

[[secret]]
key = "GOOGLE_API_KEY"
required = true
expose = false
description = "Google Gemini API credential used by RecoverIT's AI investigation engine."

[project]
name = "RecoverIT"

[[cron]]
path = "/api/jobs/case-monitor"
schedule = "0 * * * *"

[[secret]]
key = "razorpay_webhook_secret"
required = false
expose = false
description = "Razorpay webhook signing secret used to verify provider events."

[db.tables.recovery_cases]
read = "own"
write = "own"

[db.tables.evidence]
read = "own"
write = "own"

[db.tables.notifications]
read = "own"
write = "own"

[db.tables.notification_preferences]
read = "own"
write = "own"

[db.tables.feedback]
read = "own"
write = "own"