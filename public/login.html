<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · RecoverIT</title><link rel="stylesheet" href="/theme.css"></head><body><main class="login"><section class="loginbox"><a class="brand" href="/">RecoverIT<i></i></a><h1>Welcome back.</h1><p class="muted">Sign in to report problems and track recovery cases.</p><div id="app"></div></section></main><script>const A=window.hatchable.auth;const root=document.getElementById('app');let email='',code='',step='email',msg='';async function render(){root.innerHTML=`<div class="notice">Email code sign-in is passwordless. Your account and session are managed by RecoverIT's auth layer.</div><div class="field"><label>Email</label><input id="email" type="email" value="${email}" autocomplete="username webauthn" placeholder="you@example.com"></div>${step==='code'?`<div class="field"><label>6-digit code</label><input id="code" inputmode="numeric" value="${code}" placeholder="123456"></div>`:''}<div class="actions"><button class="btn primary" id="go">${step==='email'?'Continue':'Sign in'}</button>${step==='code'?`<button class="btn" id="back">Back</button>`:''}</div>${msg?`<p class="muted">${msg}</p>`:''}<p class="muted" style="font-size:12px;margin-top:25px">Google sign-in is configured when the project owner completes the Google provider setup in Hatchable.</p>`;document.getElementById('go').onclick=go;if(document.getElementById('back'))document.getElementById('back').onclick=()=>{step='email';render()};document.getElementById('email').oninput=e=>email=e.target.value;const c=document.getElementById('code');if(c)c.oninput=e=>code=e.target.value}async function waitForSession(maxMs=5000){const started=Date.now();while(Date.now()-started<maxMs){try{const s=await A.getSession();if(s&&s.user)return s}catch(e){}await new Promise(r=>setTimeout(r,250))}return null}async function go(){try{msg='';if(step==='email'){email=document.getElementById('email').value.trim();if(!email)throw Error('Enter your email address.');await A.startLogin({email});step='code';msg='Check your inbox for the sign-in code.'}else{code=document.getElementById('code').value.trim();if(!code)throw Error('Enter the sign-in code.');await A.verifyCode({email,code});msg='Signing you in securely…';render();const session=await waitForSession();if(!session)throw Error('The sign-in completed, but the session is still syncing. Please tap Sign in once more.');const raw=new URLSearchParams(location.search).get('next')||'/app.html';const next=(raw.startsWith('/')&&!raw.startsWith('//'))?raw:'/app.html';location.replace(next);return}render()}catch(e){msg=e.message||'We could not sign you in. Try again.';render()}}render();</script><script src="/motion.js"></script></body></html>
