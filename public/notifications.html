<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications · RecoverIT</title><link rel="stylesheet" href="/theme.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><a class="btn" href="/app.html">Dashboard</a></nav><main class="appmain"><div class="eyebrow">NOTIFICATION CENTER</div><h1>You're in the loop.</h1><div id="list" class="case-list"></div></main></div><script>fetch('/api/notifications/list').then(r=>r.json()).then(d=>{const el=document.getElementById('list');el.innerHTML=d.notifications?.length?d.notifications.map(n=>`<article class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><h3>${n.title}</h3><p class="muted">${n.description}</p></div><span class="pill">${n.read?'Read':'New'}</span></div>${!n.read?`<button class="btn" onclick="readN('${n.id}',this)">Mark read</button>`:''}</article>`).join(''):`<div class="notice">You're all caught up.</div>`});async function readN(id,b){await fetch('/api/notifications/read',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});b.parentElement.querySelector('.pill').textContent='Read';b.remove()}</script></body></html>
