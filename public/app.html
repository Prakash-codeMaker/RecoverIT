<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · RecoverIT</title><link rel="stylesheet" href="/theme.css"><script src="/vendor/react.js"></script><script src="/vendor/react-dom.js"></script><script src="/vendor/htm.js"></script></head><body><div id="root"></div><script>
const h=htm.bind(React.createElement),API='/api';const {useEffect,useState}=React;
function App(){const [me,setMe]=useState(null),[cases,setCases]=useState([]),[notes,setNotes]=useState([]);useEffect(()=>{Promise.all([fetch(API+'/account/me').then(r=>r.json()),fetch(API+'/cases/list').then(r=>r.json()),fetch(API+'/notifications/list').then(r=>r.json())]).then(([a,c,n])=>{setMe(a);setCases(c.cases||[]);setNotes(n.notifications||[])})},[]);if(!me)return h`<main class="login"><div class="loginbox"><h2>Loading your workspace…</h2><p class="muted">If you're signed out, RecoverIT will take you to login.</p></div></main>`;return h`<div class="app"><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="actions"><a class="btn" href="/test-mode.html">Test Mode</a><a class="btn primary" href="/report.html">Report problem</a></div></nav><main class="appmain"><div class="topline"><div><div class="eyebrow">YOUR RECOVERY WORKSPACE</div><h1>Good to see you${me.user?.name?', '+me.user.name:''}.</h1><p class="muted">How can RecoverIT help?</p></div><span class="pill">${me.user?.email||'Signed in'}</span></div><div class="grid"><div class="stat"><span>Active</span><strong>${cases.filter(x=>!['RESOLVED','FAILED'].includes(x.status)).length}</strong></div><div class="stat"><span>Needs attention</span><strong>${cases.filter(x=>x.status==='ACTION_REQUIRED').length}</strong></div><div class="stat"><span>Resolved</span><strong>${cases.filter(x=>x.status==='RESOLVED').length}</strong></div><div class="stat"><span>Updates</span><strong>${me.stats?.unread||0}</strong></div></div><div style="height:20px"></div><div class="split"><section class="card"><h3>What needs your attention?</h3><p class="muted">${notes[0]?notes[0].description:'Nothing urgent right now. Hopefully it stays that way.'}</p><div class="case-list">${cases.length?cases.map(c=>h`<a class="case-row" href="/case.html?id=${c.id}"><div><strong>${c.issue_type.replaceAll('_',' ')}</strong><div class="muted" style="font-size:12px;margin-top:5px">${c.case_number} · ₹${Number(c.amount).toLocaleString('en-IN')}</div></div><span class="pill ${c.status==='RESOLVED'?'green':''}">${c.status.replaceAll('_',' ')}</span></a>`):h`<div class="notice">Nothing to recover yet. Hopefully it stays that way.</div>`}</div></section><section class="card"><div class="eyebrow">RECOVERIT PROMISE</div><h3 style="font-size:26px;margin-top:15px">Report once. We handle the complexity.</h3><p class="muted">Evidence, payment events, policy checks and action protection stay behind the scenes.</p><a class="btn primary" href="/report.html">Start a recovery case →</a></section></div></main></div></div>`}ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);</script></body></html>
