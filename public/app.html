<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · RecoverIT</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/india-motion.css"><link rel="stylesheet" href="/case-visual.css"><link rel="stylesheet" href="/updates.css"><style>.app-nav-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:0 0 auto}.app-nav-actions .updates-wrap{display:flex;align-items:center}.app-nav-actions .btn{white-space:nowrap}.app-nav-actions .updates-toggle{min-width:108px}.app-nav-actions .btn.primary{min-width:138px}.updates-panel{top:54px}@media(max-width:560px){.app-nav-actions{gap:7px}.app-nav-actions .updates-toggle{min-width:auto;padding:11px 13px}.app-nav-actions .btn.primary{min-width:auto;padding:11px 13px}.updates-panel{right:-2px;top:50px}} </style><script src="/case-visual.js"></script><script src="/updates.js"></script></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="app-nav-actions"><div class="updates-wrap"><button class="btn updates-toggle" id="updatesToggle" type="button">Updates <span class="updates-badge" id="updatesBadge" hidden></span></button><div class="updates-panel" id="updatesPanel" hidden></div></div><span aria-hidden="true" style="display:none">Integrations</span><a class="btn primary" href="/report.html">Report problem</a></div></nav><main class="appmain" id="root"><div class="login"><div class="loginbox"><h2>Loading your workspace…</h2><p class="muted">Checking your RecoverIT session.</p></div></div></main></div><script>
(function(){
  const A=window.hatchable&&window.hatchable.auth;
  const root=document.getElementById('root');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=v=>{const n=Number(v||0);return Number.isFinite(n)?n.toLocaleString('en-IN',{maximumFractionDigits:2}):'0'};
  async function getJsonFast(url,ms=1800){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);try{const r=await fetch(url,{credentials:'include',cache:'no-store',headers:{Accept:'application/json'},signal:ctl.signal});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.error||body.message||('Request failed ('+r.status+')'));return body;}finally{clearTimeout(t)}}
  function showError(title,msg){root.innerHTML='<div class="login"><div class="loginbox"><h2>'+esc(title)+'</h2><p class="muted">'+esc(msg)+'</p><div class="actions"><a class="btn primary" href="/login">Sign in again →</a><a class="btn" href="/">Home</a></div></div></div>';}
  async function getJson(url){let last=null;for(let i=0;i<16;i++){const r=await fetch(url,{credentials:'include',cache:'no-store',headers:{Accept:'application/json'}});let body=null;try{body=await r.json()}catch(e){}if(r.status!==401){if(!r.ok)throw new Error((body&&body.message)||(body&&body.error)||('Request failed ('+r.status+')'));return body||{};}last=new Error('AUTH_PENDING');await new Promise(r=>setTimeout(r,300));try{const s=await A.getSession();if(s&&s.user)continue;}catch(e){}}const next=encodeURIComponent(location.pathname+location.search);location.replace('/login?next='+next);throw last||new Error('AUTH_REDIRECT');}
  async function boot(){
    if(!A||!A.getSession){showError('RecoverIT could not start','The authentication client was not available. Please refresh the page.');return;}
    let session;try{session=await A.getSession()}catch(e){showError('Session check failed',e.message||'Please refresh and sign in again.');return}
    if(!session||!session.user){for(let i=0;i<12&&!session?.user;i++){await new Promise(r=>setTimeout(r,250));try{session=await A.getSession()}catch(e){}}if(!session||!session.user){location.replace('/login?next='+encodeURIComponent('/app.html'));return;}}
    try{
      const [account,casesData,notesData]=await Promise.all([getJson('/api/account/me'),getJson('/api/cases/list'),getJson('/api/notifications/list')]);
      // P2 is deliberately non-blocking: the core workspace must open even if an optional monitoring service is slow.
      let p2Data={protection:[]};
      getJsonFast('/api/cases/p2-tools',1800).then(x=>{p2Data=x||{protection:[]};const w=document.getElementById('p2Watching');const n=document.getElementById('p2Needs');if(w)w.textContent=String((p2Data.protection||[]).filter(x=>x.status==='WATCHING').length);if(n)n.textContent=String((p2Data.protection||[]).filter(x=>x.status!=='WATCHING').length)}).catch(()=>{});
      const cases=Array.isArray(casesData.cases)?casesData.cases:[];const notes=Array.isArray(notesData.notifications)?notesData.notifications:[];const user=account.user||session.user;const active=cases.filter(x=>x.status!=='RESOLVED'&&x.status!=='FAILED').length;const attention=cases.filter(x=>x.status==='ACTION_REQUIRED').length;const resolved=cases.filter(x=>x.status==='RESOLVED').length;const unread=account.stats&&Number(account.stats.unread)||0;
      const caseThumb=c=>{const d=RecoverITVisuals.data(c.issue_type,c.description);return '<div class="case-thumb"><img src="/cases/'+d.image+'" alt="'+d.label+'"></div>'};const rows=cases.length?cases.map(c=>'<a class="case-row" href="/case.html?id='+encodeURIComponent(c.id)+'">'+caseThumb(c)+'<div style="flex:1"><strong>'+esc(String(c.issue_type||'Payment issue').replaceAll('_',' '))+'</strong><div class="muted" style="font-size:12px;margin-top:5px">'+esc(c.case_number)+' · ₹'+money(c.amount)+'</div></div><span class="pill '+(c.status==='RESOLVED'?'green':'')+'">'+esc(String(c.status||'').replaceAll('_',' '))+'</span></a>').join(''):'<div class="notice">Nothing to recover yet. Hopefully it stays that way.</div>';
      const note=notes[0];
      root.innerHTML='<div class="topline reveal"><div><div class="eyebrow">YOUR RECOVERY WORKSPACE</div><h1>Good to see you'+(user&&user.name?', '+esc(user.name):'')+'.</h1><p class="muted">How can RecoverIT help?</p></div><span class="pill">'+esc((user&&user.email)||'Signed in')+'</span></div><div class="workspace-context workspace-context-single"><div class="mini-context reveal"><img src="/india/delhi-metro.jpg" alt="Delhi Metro commuters"><div class="eyebrow">RECOVERIT · IN MOTION</div><div class="mini-context-copy"><strong>One payment. Many systems. One clear trail.</strong><p>RecoverIT keeps the complexity behind a calm workspace.</p></div></div></div><div class="live-workspace-bar"><span class="live-dot"></span><b>CASE MONITORING</b><span>We check your active cases and show you when something important changes.</span><time id="liveWorkspaceTime">just now</time></div><div class="grid"><div class="stat"><span>Active</span><strong id="statActive">'+active+'</strong></div><div class="stat"><span>Needs attention</span><strong id="statAttention">'+attention+'</strong></div><div class="stat"><span>Resolved</span><strong id="statResolved">'+resolved+'</strong></div><div class="stat"><span>Updates</span><strong id="statUnread">'+unread+'</strong></div></div><div style="height:20px"></div><section class="card" style="margin-bottom:20px"><div class="eyebrow">PAYMENT PROTECTION</div><h3 style="font-size:26px;margin-top:15px">Keep important payment issues in view.</h3><p class="muted">Track an expected refund or payment update. RecoverIT can remind you when a case needs checking; it does not access your bank account.</p><div class="grid" style="margin-top:15px"><div class="stat"><span>Watching</span><strong id="p2Watching">0</strong></div><div class="stat"><span>Needs checking</span><strong id="p2Needs">0</strong></div></div></section><div class="split"><section class="card"><h3>What needs your attention?</h3><p class="muted">'+esc(note?note.description:'Nothing urgent right now. Hopefully it stays that way.')+'</p><div class="case-list">'+rows+'</div></section><section class="card"><div class="eyebrow">RECOVERIT PROMISE</div><h3 style="font-size:26px;margin-top:15px">Report once. We handle the complexity.</h3><p class="muted">Evidence, payment events, policy checks and action protection stay behind the scenes.</p><a class="btn primary" href="/report.html">Start a recovery case →</a></section></div>';
    setInterval(async()=>{try{const [cd,nd]=await Promise.all([getJson('/api/cases/list'),getJson('/api/notifications/list')]);const cs=Array.isArray(cd.cases)?cd.cases:[];const activeNow=cs.filter(x=>x.status!=='RESOLVED'&&x.status!=='FAILED').length;const attentionNow=cs.filter(x=>x.status==='ACTION_REQUIRED'||x.status==='WAITING_FOR_USER').length;const resolvedNow=cs.filter(x=>x.status==='RESOLVED').length;const uNow=Array.isArray(nd.notifications)?nd.notifications.length:0;document.getElementById('statActive')?.replaceChildren(String(activeNow));document.getElementById('statAttention')?.replaceChildren(String(attentionNow));document.getElementById('statResolved')?.replaceChildren(String(resolvedNow));document.getElementById('statUnread')?.replaceChildren(String(uNow));const t=document.getElementById('liveWorkspaceTime');if(t)t.textContent='updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}catch(_){}} ,15000);const updatesToggle=document.getElementById('updatesToggle'),updatesPanel=document.getElementById('updatesPanel');updatesToggle?.addEventListener('click',()=>{const open=updatesPanel.hidden;updatesPanel.hidden=!open;if(open)RecoverITUpdates.load()});document.addEventListener('click',e=>{if(updatesPanel&&!updatesPanel.hidden&&!e.target.closest('.updates-wrap'))updatesPanel.hidden=true});
    }catch(e){if(e.message==='AUTH_REDIRECT')return;showError('We could not load your workspace',e.message||'Please refresh and try again.');}
  }
  boot();
})();
</script><script src="/motion.js"></script><script src="/analytics.js"></script></body></html>
