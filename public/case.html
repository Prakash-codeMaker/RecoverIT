<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecoverIT Investigation</title><link rel="stylesheet" href="/theme.css"><style>body{background:#07090b}.livewrap{max-width:1180px;margin:50px auto;padding:0 24px}.loading{min-height:55vh;display:grid;place-items:center}.loadcard{width:min(680px,100%);padding:32px;border:1px solid #29313a;border-radius:24px;background:#10151a}.spinner{width:24px;height:24px;border:3px solid #2d3540;border-top-color:#b8ff62;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{display:flex;gap:12px;align-items:center}.error{border-color:#65404a}.eyebrow{letter-spacing:.12em;text-transform:uppercase}.muted{color:#94a0af}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.card{background:#10151a;border:1px solid #29313a;border-radius:22px;padding:24px}.step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #242b33}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid #3a444f;flex:none}.running .dot,.done .dot{background:#b8ff62;color:#071007}.pill{display:inline-flex;padding:8px 12px;border:1px solid #35404a;border-radius:999px}.guide{margin-top:18px;padding:18px;border-left:3px solid #b8ff62;background:#13191f;border-radius:0 14px 14px 0}.livecard{box-shadow:0 12px 50px rgba(0,0,0,.18)}.livehead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.livebadge{display:flex;align-items:center;gap:8px;color:#b8ff62;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.pulse{width:8px;height:8px;background:#b8ff62;border-radius:50%;box-shadow:0 0 0 6px rgba(184,255,98,.1);animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(184,255,98,0)}}.progressbar{height:8px;background:#202831;border-radius:99px;overflow:hidden;margin-top:18px}.progressbar span{display:block;height:100%;background:#b8ff62;border-radius:99px;transition:width .5s ease}.progressmeta{display:flex;justify-content:space-between;gap:15px;color:#7f8b99;font-size:12px;margin-top:9px}.timelineitem{display:grid;grid-template-columns:14px 1fr;gap:15px;padding:17px 0;border-bottom:1px solid #242b33}.timelinepoint{width:10px;height:10px;border:2px solid #46515d;border-radius:50%;margin-top:5px}.timelinepoint.active{border-color:#b8ff62;background:#b8ff62;box-shadow:0 0 14px rgba(184,255,98,.45)}.timemeta{font-size:11px;color:#697583;margin-bottom:5px}.case-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:54px 0 28px}.case-head h1{font-size:clamp(34px,5vw,64px);letter-spacing:-.04em;margin:7px 0 8px}.case-head p{max-width:680px;font-size:16px;margin:0}.recovery-map{position:relative;padding:28px 30px 24px;margin-bottom:18px;background:linear-gradient(145deg,#111820,#0d1116);border:1px solid #29313a;border-radius:28px;overflow:hidden}.map-head,.map-foot{display:flex;justify-content:space-between;align-items:center;gap:20px}.map-head h2{font-size:28px;margin:6px 0}.map-current{font-weight:700;color:#b8ff62}.map-current span{opacity:.5;margin-left:8px}.map-track{position:relative;height:88px;margin:15px 10px 0}.map-track:before{content:"";position:absolute;left:0;right:0;top:26px;height:2px;background:#29323b}.map-progress{position:absolute;left:0;top:25px;height:4px;background:#b8ff62;border-radius:10px;box-shadow:0 0 18px rgba(184,255,98,.35);transition:width .8s ease}.map-node{position:absolute;top:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;color:#64707c;font-size:11px;white-space:nowrap}.map-node>div{width:38px;height:38px;border-radius:50%;border:1px solid #36414b;background:#0b0f13;display:grid;place-items:center}.map-node.done,.map-node.active{color:#e9eef2}.map-node.done>div{background:#b8ff62;color:#081006;border-color:#b8ff62}.map-node.active>div{border-color:#b8ff62;box-shadow:0 0 0 7px rgba(184,255,98,.08),0 0 24px rgba(184,255,98,.18);animation:nodepulse 1.8s ease-in-out infinite}.map-foot{color:#74808c;font-size:12px}.invest-visual{min-height:270px;border:1px solid #29313a;border-radius:28px;background:radial-gradient(circle at 28% 50%,rgba(184,255,98,.08),transparent 32%),#0d1217;display:flex;align-items:center;gap:52px;padding:42px 52px;margin-bottom:18px;overflow:hidden}.invest-visual h2{font-size:34px;letter-spacing:-.03em;margin:7px 0 10px}.invest-visual p{color:#91a0ae;max-width:520px;font-size:16px;line-height:1.6;margin:0}.radar{width:190px;height:190px;position:relative;flex:none;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(184,255,98,.18);border-radius:50%;inset:0}.r2{inset:28px}.r3{inset:58px}.radar-core{width:16px;height:16px;background:#b8ff62;border-radius:50%;box-shadow:0 0 30px #b8ff62,0 0 0 10px rgba(184,255,98,.08);z-index:3}.sweep{position:absolute;width:50%;height:2px;background:linear-gradient(90deg,transparent,#b8ff62);left:50%;top:50%;transform-origin:left center;animation:sweep 2.8s linear infinite;opacity:.7}.mini-journey{padding:22px 4px;margin:4px 0 14px}.mini-head{display:flex;justify-content:space-between;color:#dfe6ec;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mini-head small{font-size:11px;color:#66727e;font-weight:500;letter-spacing:0;text-transform:none}.mini-track{display:flex;gap:10px;overflow-x:auto;padding:18px 0 10px;scrollbar-width:none}.mini-track::-webkit-scrollbar{display:none}.mini-event{min-width:190px;display:flex;align-items:center;gap:10px;color:#6f7b87}.mini-event i{width:9px;height:9px;border:2px solid #46515d;border-radius:50%;flex:none}.mini-event.current{color:#f0f4f7}.mini-event.current i{background:#b8ff62;border-color:#b8ff62;box-shadow:0 0 14px rgba(184,255,98,.45)}.mini-event b{display:block;font-size:13px}.mini-event small{display:block;color:#65717d;font-size:10px;margin-top:3px}.next-card{display:flex;justify-content:space-between;align-items:center;gap:24px;border:1px solid #29313a;border-radius:22px;padding:24px 28px;background:#11171c}.next-card h3{margin:7px 0 0;font-size:18px}.next-arrow{width:42px;height:42px;border-radius:50%;background:#b8ff62;color:#071007;display:grid;place-items:center;font-size:22px;flex:none}.proof-line{display:flex;justify-content:space-between;gap:15px;color:#66727e;font-size:11px;padding:16px 4px 30px}.proof-line span:first-child{color:#b5c0ca}@keyframes sweep{to{transform:rotate(360deg)}}@keyframes nodepulse{50%{box-shadow:0 0 0 12px rgba(184,255,98,.04),0 0 28px rgba(184,255,98,.25)}}@media(max-width:800px){.grid{grid-template-columns:1fr}.livewrap{margin-top:25px}.livehead,.progressmeta{flex-direction:column}.livebadge{margin-top:4px}.case-head{margin-top:28px;align-items:flex-start;flex-direction:column}.case-head h1{font-size:38px}.map-track{margin-left:0;margin-right:0}.map-node{font-size:9px}.invest-visual{min-height:0;flex-direction:column;align-items:flex-start;gap:25px;padding:32px}.radar{width:140px;height:140px}.invest-visual h2{font-size:27px}.proof-line{flex-direction:column}}}</style></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="actions"><a class="btn" href="/app.html">Dashboard</a><a class="btn primary" href="/report.html">New case</a></div></nav><main id="root" class="livewrap"><div class="loading"><div class="loadcard"><div class="status"><div class="spinner"></div><div><h2 style="margin:0">Opening your case…</h2><p class="muted" id="loadmsg">Getting the latest case status.</p></div></div><div class="muted" style="margin-top:20px;font-size:13px">This should take only a moment.</div></div></div></main></div><script>
(function(){
 const params=new URLSearchParams(location.search),requested=params.get('id'),root=document.getElementById('root');let currentId=requested,started=false,timer=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const st=s=>String(s||'').replaceAll('_',' '); const money=v=>Number(v)?'₹'+Number(v).toLocaleString('en-IN'):'Amount pending';
 function showError(title,msg){root.innerHTML='<div class="loading"><div class="loadcard error"><div class="eyebrow">CASE ERROR</div><h1>'+esc(title)+'</h1><p class="muted">'+esc(msg)+'</p><div class="actions" style="margin-top:20px"><a class="btn primary" href="/app.html">Dashboard</a><button class="btn" id="retry">Retry</button></div></div></div>';document.getElementById('retry').onclick=load}
 async function getStatus(id){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),2500);try{const r=await fetch('/api/cases/status?case_id='+encodeURIComponent(id),{credentials:'include',cache:'no-store',signal:ctl.signal});const d=await r.json();return {r,d}}finally{clearTimeout(to)}}
 async function load(){
  if(!currentId){showError('No case selected','Return to the dashboard and open a case.');return}
  const msg=document.getElementById('loadmsg');if(msg)msg.textContent='Connecting to the case service…';
  try{
   let x=await getStatus(currentId);
   if(x.r.status===401){location.href='/login?next='+encodeURIComponent('/case.html?id='+currentId);return}
   if(x.r.status===404){
    if(msg)msg.textContent='That case link is no longer valid. Finding your latest case…';
    const fallback=await getStatus('');
    if(!fallback.r.ok)throw Error('Your session is active, but no case could be found. Return to the dashboard and open the case from there.');
    currentId=fallback.d.case.id;x=fallback;history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(currentId));
   }
   if(!x.r.ok)throw Error(x.d.error||'The case service could not respond.');
   render(x.d);if(!started && (params.get('autostart')==='1'||x.d.case.status==='REPORTED')) start();
  }catch(e){if(e.name==='AbortError')showError('The case service is taking too long','The request did not return within 2.5 seconds. This is a connection/API problem, not the investigation itself.');else showError('We could not open this case',e.message)}
 }
 function render(d){const c=d.case,steps=d.steps||[],events=d.events||[],proof=d.evidence||[],p=d.progress||{},running=steps.some(s=>s.status==='RUNNING'),waiting=c.status==='WAITING_FOR_USER';const pct=Math.max(0,Math.min(100,Number(p.percent||0)));const current=steps.find(s=>s.status==='RUNNING')||steps.find(s=>s.status==='WAITING')||steps.find(s=>s.status==='QUEUED');const names=['Understand','Check proof','Verify payment','Recovery plan'];const active=Math.max(0,steps.findIndex(s=>s.status==='RUNNING'));const simple=waiting?(d.guidance||'We need one more thing from you.'):(current?.detail||d.guidance||'RecoverIT is checking the evidence now.');root.innerHTML='<div class="case-head"><div><div class="eyebrow">CASE '+esc(c.case_number)+'</div><h1>'+esc(st(c.issue_type))+'</h1><p class="muted">'+esc(c.description)+'</p></div><div class="livebadge"><span class="pulse"></span>'+(waiting?'Your turn':'Investigating')+'</div></div><div class="recovery-map"><div class="map-head"><div><div class="eyebrow">RECOVERY JOURNEY</div><h2>'+pct+'% complete</h2></div><div class="map-current">'+esc(names[active]||'Monitoring')+' <span>→</span></div></div><div class="map-track"><div class="map-progress" style="width:'+pct+'%"></div>'+steps.map((s,i)=>'<div class="map-node '+(s.status==='DONE'?'done ':s.status==='RUNNING'?'active ':'')+'" style="left:'+((steps.length>1?i/(steps.length-1):0)*100)+'%"><div>'+(s.status==='DONE'?'✓':s.status==='RUNNING'?'':'')+'</div><span>'+esc(names[i]||s.title)+'</span></div>').join('')+'</div><div class="map-foot"><span>'+p.done+' of '+p.total+'</span><span>Live</span></div></div><div class="invest-visual"><div class="radar"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="radar-core"></div><div class="sweep"></div></div><div><div class="eyebrow">RIGHT NOW</div><h2>'+esc(current?.title||'Following your case')+'</h2><p>'+esc(simple)+'</p></div></div><div class="mini-journey"><div class="mini-head"><span>CASE JOURNEY</span><small>Updates automatically</small></div><div class="mini-track">'+(events.length?events.slice().reverse().slice(0,6).map((e,i)=>'<div class="mini-event '+(i===0?'current':'')+'"><i></i><div><b>'+esc(e.title)+'</b><small>'+new Date(e.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</small></div></div>').join(''):'<span class="muted">Your investigation will appear here.</span>')+'</div></div><div class="next-card"><div><div class="eyebrow">YOUR NEXT STEP</div><h3>'+esc(waiting?(d.guidance||'We need one more thing from you.'):d.guidance||'Nothing needed right now.')+'</h3></div><div class="next-arrow">→</div></div><div class="proof-line"><span>'+proof.length+' proof file'+(proof.length===1?'':'s')+'</span><span>Evidence is checked as new information arrives</span></div><button class="btn primary" id="investigate" style="display:none">'+(running?'Investigation running':'Run investigation')+'</button><p id="msg" class="muted" style="font-size:12px"></p>
 async function start(){if(started)return;started=true;const b=document.getElementById('investigate'),m=document.getElementById('msg');if(b){b.disabled=true;b.textContent='Starting investigation…'}if(m)m.textContent='Starting the investigation in the background — this should return quickly.';try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),4000);const r=await fetch('/api/cases/investigate',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:currentId}),signal:ctl.signal});clearTimeout(to);const d=await r.json();if(r.status===401){location.href='/login?next='+encodeURIComponent('/case.html?id='+currentId);return}if(!r.ok)throw Error(d.error||'Could not start investigation.');started=false;await load()}catch(e){started=false;if(m)m.textContent=e.name==='AbortError'?'The start request is taking too long. The investigation service is not responding yet.':e.message;if(b){b.disabled=false;b.textContent='Retry investigation'}}}
 load();timer=setInterval(()=>{if(!document.hidden&&!started)load()},5000);window.addEventListener('beforeunload',()=>clearInterval(timer));
})();
</script></body></html>
