<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case · RecoverIT</title><link rel="stylesheet" href="/theme.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="actions"><a class="btn" href="/app.html">Dashboard</a><a class="btn primary" href="/report.html">New case</a></div></nav><main class="appmain" id="root"><div class="loginbox" style="margin:80px auto;max-width:620px"><h2>Loading investigation…</h2><p class="muted">Reconstructing your payment timeline.</p></div></main></div><script>
(function(){
 const id=new URLSearchParams(location.search).get('id'); const root=document.getElementById('root');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=v=>{const n=Number(v);return Number.isFinite(n)?'₹'+n.toLocaleString('en-IN'):''};
 const state=s=>String(s||'').replaceAll('_',' ');
 function errorPage(m){root.innerHTML='<div class="card" style="margin:80px auto;max-width:700px"><div class="eyebrow">INVESTIGATION ERROR</div><h1>We could not load this case.</h1><p class="muted">'+esc(m||'Something went wrong while loading the investigation.')+'</p><div class="actions"><a class="btn primary" href="/app.html">Back to dashboard</a><button class="btn" id="retry">Retry</button></div></div>';document.getElementById('retry').onclick=load;}
 async function load(){
  if(!id){errorPage('No case ID was provided.');return;}
  root.innerHTML='<div class="loginbox" style="margin:80px auto;max-width:620px"><h2>Loading investigation…</h2><p class="muted">Reconstructing your payment timeline.</p></div>';
  try{const r=await fetch('/api/cases/'+encodeURIComponent(id),{credentials:'include'});if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+'?id='+id);return}const d=await r.json();if(!r.ok||!d.case)throw new Error(d.error||'The case could not be loaded.');render(d)}catch(e){errorPage(e.message)}
 }
 function render(d){
  const c=d.case, events=d.events||[], steps=d.steps||[], actions=d.actions||[];
  root.innerHTML='<div class="topline"><div><div class="eyebrow">'+esc(c.case_number)+'</div><h1>'+esc(state(c.issue_type))+'</h1><p class="muted">'+money(c.amount)+' · '+esc(c.merchant_name||'Merchant not provided')+'</p></div><span class="pill '+(c.status==='RESOLVED'?'green':'')+'">'+esc(state(c.status))+'</span></div><div class="split"><section class="card"><h3>What happened?</h3><p class="muted">'+esc(c.description)+'</p><h3 style="margin-top:32px">What we know</h3><div class="detail"><div><span>Payment method</span><b>'+esc(c.payment_method||'Unknown')+'</b></div><div><span>Transaction reference</span><b>'+esc(c.transaction_reference||'Unknown')+'</b></div><div><span>Confidence</span><b>'+esc(c.confidence_score||'Not scored')+'</b></div></div><h3 style="margin-top:32px">Investigation timeline</h3><div class="timeline">'+(events.length?events.map(e=>'<div class="event done"><div class="dot"></div><h4>'+esc(e.title)+'</h4><p>'+esc(e.detail||'')+'</p><p style="margin-top:4px;font-size:11px">'+esc(e.source||'RecoverIT')+' · '+new Date(e.created_at).toLocaleString()+'</p></div>').join(''):'<p class="muted">No investigation events yet.</p>')+'</div></section><aside><section class="card"><div class="eyebrow">WHAT WE’RE DOING</div><div style="height:15px"></div>'+(steps.length?steps.map(s=>'<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #222832"><span>'+(s.status==='DONE'?'✓':s.status==='RUNNING'?'●':'○')+'</span><div><b>'+esc(s.title)+'</b><div class="muted" style="font-size:12px">'+esc(s.status)+(s.detail?' · '+esc(s.detail):'')+'</div></div></div>').join(''):'<p class="muted">Investigation steps will appear here.</p>')+'<button class="btn primary" style="margin-top:18px;width:100%;justify-content:center" id="investigate">Run investigation</button><div class="notice" style="margin-top:12px">AI can summarize evidence and conflicts. It cannot authorize money movement.</div><p class="muted" id="msg" style="margin-top:12px"></p></section><section class="card" style="margin-top:14px"><div class="eyebrow">ADVANCED</div><h3>Action Ledger</h3>'+(actions.length?actions.map(a=>'<div class="detail"><div><span>'+esc(a.action_type)+'</span><b>'+esc(a.approval_state)+'</b></div><div><span>Provider</span><b>'+esc(a.provider||'—')+'</b></div><div><span>Result</span><b>'+esc(a.resulting_state||'—')+'</b></div></div>').join(''):'<p class="muted">No money-adjacent action has been recorded.</p>')+'<button class="btn" id="refund" style="margin-top:12px;width:100%;justify-content:center">Attempt test refund action</button></section></aside></div>';
  document.getElementById('investigate').onclick=investigate;document.getElementById('refund').onclick=refund;
 }
 async function investigate(){const b=document.getElementById('investigate'),m=document.getElementById('msg');b.disabled=true;b.textContent='Investigating…';m.textContent='RecoverIT is checking the case and rebuilding the evidence story.';try{const r=await fetch('/api/cases/investigate',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:id})});const x=await r.json();if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+'?id='+id);return}if(!r.ok)throw new Error(x.error||'Investigation failed.');await load();}catch(e){m.textContent=e.message;b.disabled=false;b.textContent='Run investigation';}}
 async function refund(){const b=document.getElementById('refund'),m=document.getElementById('msg');b.disabled=true;b.textContent='Checking…';try{const r=await fetch('/api/actions/refund',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:id})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Action failed.');m.textContent=x.blocked?'Duplicate action blocked — your money was protected.':x.error||'Test action recorded.';await load();}catch(e){m.textContent=e.message;b.disabled=false;b.textContent='Attempt test refund action';}}
 load();
})();
</script></body></html>
