<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live investigation · RecoverIT</title><link rel="stylesheet" href="/theme.css"><style>.live{border:1px solid #33404b;background:#0e1318;border-radius:22px;padding:20px;margin-bottom:18px}.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#b8ff62;box-shadow:0 0 0 0 rgba(184,255,98,.45);animation:ping 1.6s infinite;margin-right:8px}.guide{border-left:3px solid #b8ff62;padding:15px 18px;background:#12171d;border-radius:0 14px 14px 0}.proof{display:flex;justify-content:space-between;gap:12px;padding:12px;background:#141920;border-radius:10px;margin-top:8px}.score{font-size:38px;font-weight:800}.statusline{display:flex;justify-content:space-between;gap:15px;align-items:center}.stepdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid #3b444f}.steprow{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #252b33}.steprow.running .stepdot{background:#b8ff62;color:#071007;animation:ping 1.3s infinite}.steprow.done .stepdot{background:#b8ff62;color:#071007}@keyframes ping{70%{box-shadow:0 0 0 10px rgba(184,255,98,0)}} </style></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="actions"><a class="btn" href="/app.html">Dashboard</a><a class="btn primary" href="/report.html">New case</a></div></nav><main class="appmain" id="root"><div class="loginbox" style="margin:80px auto;max-width:700px"><h2>Loading your investigation…</h2><p class="muted">Connecting to your case.</p></div></main></div><script>(function(){const id=new URLSearchParams(location.search).get('id'),auto=new URLSearchParams(location.search).get('autostart')==='1',root=document.getElementById('root');let timer=null,started=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const state=s=>String(s||'').replaceAll('_',' ');const money=v=>Number(v)?'₹'+Number(v).toLocaleString('en-IN'):'Amount not captured yet';function err(m){root.innerHTML='<div class="card" style="margin:70px auto;max-width:760px"><div class="eyebrow">CASE ERROR</div><h1>We could not load this case.</h1><p class="muted">'+esc(m)+'</p><div class="actions"><a class="btn primary" href="/app.html">Dashboard</a><button class="btn" id="retry">Retry</button></div></div>';document.getElementById('retry').onclick=load}async function load(){if(!id){err('No case ID was provided.');return}try{const r=await fetch('/api/cases/status?case_id='+encodeURIComponent(id),{credentials:'include'});if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+'?id='+id);return}const d=await r.json();if(!r.ok)throw Error(d.error||'The investigation service returned an error.');render(d);if(auto&&!started&&!d.steps.some(s=>s.status==='DONE'&&s.step_key==='payment'))start();}catch(e){err(e.message)}}function render(d){const c=d.case,steps=d.steps||[],events=d.events||[],proof=d.evidence||[];const running=steps.some(s=>s.status==='RUNNING'||s.status==='WAITING');root.innerHTML='<div class="topline"><div><div class="eyebrow">'+esc(c.case_number)+'</div><h1>Recovering your payment</h1><p class="muted">'+money(c.amount)+' · '+esc(c.payment_method||'payment')+' · '+esc(c.status)+'</p></div><span class="pill"><span class="pulse"></span>'+esc(state(c.status))+'</span></div><div class="live"><div class="statusline"><div><b>Live investigation</b><div class="muted" id="liveText">'+(running?'RecoverIT is working through the evidence now.':'Investigation snapshot updated.')+'</div></div><div class="eyebrow">AUTO-REFRESH</div></div></div><div class="split"><section><div class="card"><div class="eyebrow">WHAT HAPPENED</div><h3>'+esc(c.issue_type)+'</h3><p class="muted">'+esc(c.description)+'</p><div class="guide"><b>What you should do now</b><p class="muted" id="guidance">'+(proof.length?'Keep the original proof available. Do not send another refund request until RecoverIT reconciles the existing payment/refund state.':'Upload the payment receipt, bank statement, refund message, or merchant response. More evidence gives the investigation something concrete to compare.')+'</p></div></div><div class="card" style="margin-top:16px"><div class="eyebrow">INVESTIGATION TIMELINE</div><div class="timeline">'+(events.length?events.map(e=>'<div class="event done"><div class="dot"></div><h4>'+esc(e.title)+'</h4><p>'+esc(e.detail||'')+'</p><small class="muted">'+esc(e.source||'RecoverIT')+' · '+new Date(e.created_at).toLocaleString()+'</small></div>').join(''):'<p class="muted">Waiting for the first investigation event.</p>')+'</div></div><div class="card" style="margin-top:16px"><div class="eyebrow">EVIDENCE ASSESSMENT</div><div class="score">'+(c.confidence_score!=null?esc(c.confidence_score)+'%':'—')+'</div><p class="muted">Consistency confidence based on the supplied material and available provider evidence. This is <b>not</b> a claim that a document is authentic.</p></div><div class="card" style="margin-top:16px"><div class="eyebrow">YOUR PROOF</div>'+(proof.length?proof.map(p=>'<div class="proof"><span>'+esc(p.filename)+'</span><span class="muted">'+esc(p.content_type)+' · SHA-256 recorded</span></div>').join(''):'<p class="muted">No proof uploaded yet.</p>')+'<label class="btn" style="margin-top:14px;cursor:pointer" for="moreProof">Add more proof →</label><input id="moreProof" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf,video/mp4" style="display:none"></div></section><aside><div class="card"><div class="eyebrow">WHAT RECOVERIT IS CHECKING</div>'+steps.map((s,i)=>'<div class="steprow '+String(s.status).toLowerCase()+'"><div class="stepdot">'+(s.status==='DONE'?'✓':s.status==='RUNNING'?'●':'○')+'</div><div><b>'+esc(s.title)+'</b><div class="muted" style="font-size:12px">'+esc(s.status)+(s.detail?' · '+esc(s.detail).slice(0,240):'')+'</div></div></div>').join('')+'<button class="btn primary" id="investigate" style="margin-top:18px;width:100%;justify-content:center">'+(running?'Investigation running…':'Run / refresh investigation')+'</button><p class="muted" id="msg" style="font-size:12px;margin-top:10px">'+(proof.length?'Evidence consistency is assessed from supplied material; authenticity cannot be guaranteed from an upload alone.':'No proof means no evidence-based genuineness assessment yet.')+'</p></div><div class="card" style="margin-top:16px"><div class="eyebrow">MONEY SAFETY</div><h3>No blind actions</h3><p class="muted">RecoverIT can recommend the safest next step. It will not claim a refund happened, or send another refund, without verified provider state and policy checks.</p></div></aside></div>';document.getElementById('investigate').onclick=start;const more=document.getElementById('moreProof');if(more)more.onchange=async()=>{for(const f of Array.from(more.files||[])){const fd=new FormData();fd.append('case_id',id);fd.append('file',f);const r=await fetch('/api/evidence/upload',{method:'POST',credentials:'include',body:fd});if(!r.ok){const x=await r.json().catch(()=>({}));alert(x.error||'Could not upload '+f.name)}}await load();if(!started)start()}async function start(){if(started)return;started=true;const b=document.getElementById('investigate'),m=document.getElementById('msg');if(b)b.disabled=true;if(m)m.textContent='Comparing your story, proof and available provider evidence…';try{const r=await fetch('/api/cases/investigate',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:id})});const d=await r.json();if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+'?id='+id);return}if(!r.ok)throw Error(d.error||'Investigation failed.');started=false;await load();if(d.provider_evidence===0){const m2=document.getElementById('msg');if(m2)m2.textContent='No provider-side event is connected to this case yet. RecoverIT has not assumed a provider status.'}}catch(e){started=false;if(m) m.textContent=e.message;if(b){b.disabled=false;b.textContent='Retry investigation'}}}load();timer=setInterval(()=>{if(!document.hidden)load()},5000);window.addEventListener('beforeunload',()=>clearInterval(timer));})();</script></body></html>
