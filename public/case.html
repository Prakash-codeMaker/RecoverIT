<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case · RecoverIT</title><link rel="stylesheet" href="/theme.css"><script src="/vendor/react.js"></script><script src="/vendor/react-dom.js"></script><script src="/vendor/htm.js"></script></head><body><div id="root"></div><script>
const h=htm.bind(React.createElement),id=new URLSearchParams(location.search).get('id'),API='/api';const {useEffect,useState}=React;function App(){const [d,setD]=useState(null),[msg,setMsg]=useState('');const load=()=>fetch(API+'/cases/'+id).then(r=>r.json()).then(setD);useEffect(()=>{load()},[]);if(!d)return h`<main class="login"><div class="loginbox"><h2>Loading investigation…</h2></div></main>`;const c=d.case;return h`<div class="app"><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="actions"><a class="btn" href="/app.html">Dashboard</a><a class="btn primary" href="/report.html">New case</a></div></nav><main class="appmain"><div class="topline"><div><div class="eyebrow">${c.case_number}</div><h1>${c.issue_type.replaceAll('_',' ')}</h1><p class="muted">₹${Number(c.amount).toLocaleString('en-IN')} · ${c.merchant_name||'Merchant not provided'}</p></div><span class="pill ${c.status==='RESOLVED'?'green':''}">${c.status.replaceAll('_',' ')}</span></div><div class="split"><section class="card"><h3>What happened?</h3><p class="muted">${c.description}</p><h3 style="margin-top:32px">What we know</h3><div class="detail"><div><span>Payment method</span><b>${c.payment_method||'Unknown'}</b></div><div><span>Transaction reference</span><b>${c.transaction_reference||'Unknown'}</b></div><div><span>Confidence</span><b>${c.confidence_score||'Not scored'}</b></div></div><h3 style="margin-top:32px">Investigation timeline</h3><div class="timeline">${d.events.map(e=>h`<div class="event done"><div class="dot"></div><h4>${e.title}</h4><p>${e.detail||''}</p><p style="margin-top:4px;font-size:11px">${e.source} · ${new Date(e.created_at).toLocaleString()}</p></div>`)}</div></section><aside><section class="card"><div class="eyebrow">WHAT WE'RE DOING</div><div style="height:15px"></div>${d.steps.map(s=>h`<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #222832"><span>${s.status==='DONE'?'✓':s.status==='RUNNING'?'●':'○'}</span><div><b>${s.title}</b><div class="muted" style="font-size:12px">${s.status}${s.detail?' · '+s.detail:''}</div></div></div>`)}<button class="btn primary" style="margin-top:18px;width:100%;justify-content:center" id="investigate">Run investigation</button><div class="notice">AI can summarize evidence and conflicts. It cannot authorize money movement.</div>${msg?h`<p class="muted">${msg}</p>`:''}</section><section class="card" style="margin-top:14px"><div class="eyebrow">ADVANCED</div><h3>Action Ledger</h3>${d.actions.length?d.actions.map(a=>h`<div class="detail"><div><span>${a.action_type}</span><b>${a.approval_state}</b></div><div><span>Provider</span><b>${a.provider}</b></div><div><span>Result</span><b>${a.resulting_state}</b></div></div>`):h`<p class="muted">No money-adjacent action has been recorded.</p>`}<button class="btn" id="refund" style="margin-top:12px;width:100%;justify-content:center">Attempt test refund action</button></section></aside></div></main></div></div>`;setTimeout(()=>{const inv=document.getElementById('investigate');if(inv)inv.onclick=async()=>{setMsg('RecoverIT is checking the case…');const r=await fetch(API+'/cases/investigate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:id})});const x=await r.json();setMsg(x.explanation||x.error||'Investigation updated.');load()};const ref=document.getElementById('refund');if(ref)ref.onclick=async()=>{const r=await fetch(API+'/actions/refund',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:id})});const x=await r.json();setMsg(x.blocked?'Duplicate action blocked — your money was protected.':x.error||'Test action recorded.');load()}},0)}ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
