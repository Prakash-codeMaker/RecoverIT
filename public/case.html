(function(){
 const params=new URLSearchParams(location.search),requested=params.get('id'),root=document.getElementById('root');let currentId=requested,started=false,timer=null,firstPaint=true;

 function showError(title,msg){root.innerHTML='<div class="loading"><div class="loadcard error"><div class="eyebrow">CASE ERROR</div><h1>'+esc(title)+'</h1><p class="muted">'+esc(msg)+'</p><div class="actions" style="margin-top:20px"><a class="btn primary" href="/app.html">Dashboard</a><button class="btn" id="retry">Retry</button></div></div></div>';document.getElementById('retry').onclick=load}
 async function getStatus(id){const ctl=new AbortController();const request=fetch('/api/cases/live-status?case_id='+encodeURIComponent(id),{credentials:'include',cache:'no-store',signal:ctl.signal}).then(async r=>({r,d:await r.json()}));const timeout=new Promise((_,reject)=>setTimeout(()=>{ctl.abort();reject(new Error('TIMEOUT'))},1800));return await Promise.race([request,timeout])}
 async function load(){
  if(!currentId){showError('No case selected','Return to the dashboard and open a case.');return}
  if(firstPaint){root.innerHTML='<div class="case-head"><div><div class="eyebrow">LIVE INVESTIGATION</div><h1>Following your case</h1><p class="muted">RecoverIT is reconstructing what happened and checking for the safest next step.</p></div><div class="livebadge"><span class="pulse"></span>Live</div></div><div class="invest-visual"><div class="radar"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="radar-core"></div><div class="sweep"></div></div><div><div class="eyebrow">RIGHT NOW</div><h2>Investigation is running</h2><p>Your case is being checked in the background. This screen will update as soon as new information is available.</p></div></div><div class="next-card"><div><div class="eyebrow">CASE</div><h3>'+esc(currentId.slice(0,8).toUpperCase())+' · Live updates enabled</h3></div><div class="next-arrow">→</div></div>';} 
  const msg=document.getElementById('loadmsg');if(msg)msg.textContent='';

   if(x.r.status===404){
    const lr=await fetch('/api/cases/list',{credentials:'include',cache:'no-store'});const ld=await lr.json();
    if(!lr.ok||!ld.cases?.length)throw Error('This case is no longer available. Open the Dashboard and start a new case so RecoverIT can continue tracking it.');
    currentId=ld.cases[0].id;x=await getStatus(currentId);history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(currentId));

  }catch(e){if(e.message==='TIMEOUT'||e.name==='AbortError')showError('The case service is unavailable','RecoverIT could not reach the case service quickly enough. Your case has not been lost. Please retry or return to Dashboard.');else showError('We could not open this case',e.message)}
 }
 function caseScene(c,waiting,proof){const key=RecoverITVisuals.keyFrom(c.issue_type,c.description);return '<div class="case-visual-stack">'+RecoverITVisuals.html({key,amount:c.amount})+'<div class="case-proof-card"><div class="eyebrow">CASE SIGNAL</div><strong>'+money(c.amount)+'</strong><div class="case-proof-line"></div><div class="case-proof-row"><span>Payment method</span><b>'+esc(c.payment_method||'Unknown')+'</b></div><div class="case-proof-row"><span>Proof attached</span><b>'+proof.length+'</b></div><div class="case-proof-row '+(waiting?'blocked':'')+'"><span>Next state</span><b>'+esc(waiting?'Your input':'RecoverIT investigating')+'</b></div></div></div>'}
 function render(d){const c=d.case,steps=d.steps||[],events=d.events||[],proof=d.evidence||[],p=d.progress||{},running=steps.some(s=>s.status==='RUNNING'),waiting=c.status==='WAITING_FOR_USER';const pct=Math.max(0,Math.min(100,Number(p.percent||0)));const current=steps.find(s=>s.status==='RUNNING')||steps.find(s=>s.status==='WAITING')||steps.find(s=>s.status==='QUEUED');const names=['Understand','Check proof','Verify payment','Recovery plan'];const active=Math.max(0,steps.findIndex(s=>s.status==='RUNNING'));const simple=waiting?(d.guidance||'We need one more thing from you.'):(current?.detail||d.guidance||'RecoverIT is checking the evidence now.');root.innerHTML='<div class="case-head"><div><div class="eyebrow">CASE '+esc(c.case_number)+'</div><h1>'+esc(st(c.issue_type))+'</h1><p class="muted">'+esc(c.description)+'</p></div><div class="livebadge"><span class="pulse"></span>'+(waiting?'Your turn':'Investigating')+'</div></div>'+caseScene(c,waiting,proof)+'<div class="recovery-map"><div class="map-head"><div><div class="eyebrow">RECOVERY JOURNEY</div><h2>'+pct+'% complete</h2></div><div class="map-current">'+esc(names[active]||'Monitoring')+' <span>→</span></div></div><div class="map-track"><div class="map-progress" style="width:'+pct+'%"></div>'+steps.map((s,i)=>'<div class="map-node '+(s.status==='DONE'?'done ':s.status==='RUNNING'?'active ':'')+'" style="left:'+((steps.length>1?i/(steps.length-1):0)*100)+'%"><div>'+(s.status==='DONE'?'✓':s.status==='RUNNING'?'':'')+'</div><span>'+esc(names[i]||s.title)+'</span></div>').join('')+'</div><div class="map-foot"><span>'+p.done+' of '+p.total+'</span><span>Live</span></div></div><div class="case-now"><span class="pulse"></span><div><div class="eyebrow">RIGHT NOW</div><strong>'+esc(current?.title||'Following your case')+'</strong></div><span class="case-now-state">'+esc(waiting?'Your input needed':'Investigation running')+'</span></div><div class="next-card"><div><div class="eyebrow">NEXT STEP</div><h3>'+esc(waiting?(d.guidance||'One more thing is needed from you.'):d.guidance||'No action needed right now.')+'</h3></div><div class="next-arrow">→</div></div><div id="resolutionStrip" class="resolution-strip"><div><span class="resolution-state">RecoverIT</span><strong>Following the case</strong><small>Building the latest resolution state…</small></div></div><div class="p1-tools"><button class="p1-tool" id="p1Provider"><b>Provider workflow</b><span>Guidance tailored to this payment method.</span></button><button class="p1-tool" id="p1Escalation"><b>Escalation ladder</b><span>See the safest route if the first response fails.</span></button><button class="p1-tool" id="p1Pack"><b>Dispute Pack</b><span>Prepare a clean case summary and complaint.</span></button><button class="p1-tool" id="p1Contact"><b>WhatsApp / Email</b><span>Continue the case elsewhere without losing context.</span></button><button class="p1-tool" id="p2Monitor"><b>Monitor payment / refund</b><span>Watch a checkpoint you expect and get a meaningful alert.</span></button><button class="p1-tool" id="p2Escalate"><b>Prepare escalation</b><span>Build the next formal complaint from the verified case facts.</span></button></div><div id="p1Drawer" class="p1-drawer"></div><div class="proof-line"><span>'+proof.length+' proof file'+(proof.length===1?'':'s')+'</span><span>Updates automatically</span></div><div class="p1-tools" style="margin-top:0"><button class="p1-tool" id="caseDownload"><b>Download report</b><span>TXT, JSON, CSV, HTML or print/save as PDF.</span></button><button class="p1-tool" id="caseShare"><b>Share report</b><span>Create a safe link you can send to anyone.</span></button></div><div id="reportStatus" class="context-status"></div><button class="btn primary" id="investigate" style="display:none">'+(running?'Investigation running':'Run investigation')+'</button><p id="msg" class="muted" style="font-size:12px"></p>';wireP1();
 const report={case:c,steps,events,proof,progress:p,guidance:d.guidance||''};

 function csv(){const rows=[['Field','Value'],['Case',c.case_number],['Issue',c.issue_type],['Status',c.status],['Amount',c.amount??''],['Payment method',c.payment_method||''],['Description',c.description||''],['Progress',pct+'%'],['Next step',d.guidance||''],['Proof files',proof.length]];return rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')}
 function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
 function reportHtml(){return '<!doctype html><html><head><meta charset="utf-8"><title>RecoverIT '+esc(c.case_number)+'</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px;color:#172018}h1{font-size:36px}.box{border:1px solid #ddd;border-radius:16px;padding:20px;margin:15px 0}small{color:#667}</style></head><body><h1>RecoverIT Case Report</h1><div class="box"><small>'+esc(c.case_number)+'</small><h2>'+esc(c.issue_type)+'</h2><p>'+esc(c.description)+'</p><p><b>Status:</b> '+esc(c.status)+'<br><b>Amount:</b> '+esc(c.amount==null?'Not provided':'₹'+c.amount)+'<br><b>Payment method:</b> '+esc(c.payment_method||'Not provided')+'<br><b>Progress:</b> '+pct+'%</p></div><div class="box"><b>Next step</b><p>'+esc(d.guidance||'RecoverIT is continuing the investigation.')+'</p><p>Proof files: '+proof.length+'</p></div></body></html>'}
 document.getElementById('caseDownload')?.addEventListener('click',()=>{const choice=prompt('Download format: TXT, JSON, CSV, HTML, or PDF (PDF opens print dialog).','PDF');if(!choice)return;const f=choice.toUpperCase();const base='recoverit-'+String(c.case_number||'case').replace(/[^a-z0-9-]/gi,'_');if(f==='TXT')download(base+'.txt',reportText(),'text/plain');else if(f==='JSON')download(base+'.json',JSON.stringify(report,null,2),'application/json');else if(f==='CSV')download(base+'.csv',csv(),'text/csv');else if(f==='HTML')download(base+'.html',reportHtml(),'text/html');else if(f==='PDF'){const w=window.open('','_blank');if(!w){alert('Please allow pop-ups to save the PDF.');return}w.document.write(reportHtml());w.document.close();w.focus();setTimeout(()=>w.print(),250)}else alert('Choose TXT, JSON, CSV, HTML, or PDF.')});
 document.getElementById('caseShare')?.addEventListener('click',async()=>{const status=document.getElementById('reportStatus');status.textContent='Creating a safe share link…';try{const r=await fetch('/api/cases/share',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:currentId})});const x=await r.json();if(!r.ok)throw Error(x.error||'Could not create share link.');const url=location.origin+x.url;if(navigator.share)await navigator.share({title:'RecoverIT '+c.case_number,text:'RecoverIT case report',url});else{await navigator.clipboard.writeText(url);status.textContent='Share link copied. It is safe to send to anyone.';return}status.textContent='Share link ready.'}catch(e){status.textContent=e.name==='AbortError'?'Share cancelled.':e.message}});
 let p1Data=null,p1Voice=null,p1Listening=false;async function loadP1(){if(p1Data)return p1Data;const r=await fetch('/api/cases/p1-tools?case_id='+encodeURIComponent(currentId),{credentials:'include'});if(!r.ok)throw Error('P1 tools unavailable');p1Data=await r.json();return p1Data}function openP1(html){const d=document.getElementById('p1Drawer');d.innerHTML=html;d.classList.add('open');d.scrollIntoView({behavior:'smooth',block:'nearest'})}function copyP1(text){navigator.clipboard?.writeText(text).then(()=>{const m=document.getElementById('p1Status');if(m)m.textContent='Copied to clipboard.'})}async function p1Provider(){try{const d=await loadP1();openP1('<h3>'+esc(d.provider_info.label)+' workflow</h3><p class="p1-muted">'+esc(d.provider_info.next)+'</p><div class="p1-ladder">'+d.provider_info.channels.map((x,i)=>'<div class="p1-level"><b>Step '+(i+1)+'</b> · '+esc(x)+'<small>Keep the transaction reference, provider response and evidence together.</small></div>').join('')+'</div>')}catch(e){openP1('<p class="p1-muted">Provider guidance is temporarily unavailable. Your investigation continues normally.</p>')}}async function p1Escalation(){try{const d=await loadP1();openP1('<h3>Escalation ladder</h3><p class="p1-muted">Start with the party closest to the transaction. Move upward only when the current route does not resolve the case.</p><div class="p1-ladder">'+d.escalation.map((x,i)=>'<div class="p1-level"><b>'+esc(x.title)+'</b><small>'+esc(x.when)+' · '+esc(x.action)+'</small></div>').join('')+'</div>')}catch(e){openP1('<p class="p1-muted">Escalation guidance is temporarily unavailable.</p>')}}async function p1Pack(){try{const d=await loadP1();openP1('<h3>Your Dispute Pack</h3><p class="p1-muted">A clean, portable summary of the facts RecoverIT currently has. Review it before sending.</p><textarea class="p1-copy" readonly>'+esc(d.complaint)+'</textarea><div class="p1-actions"><button class="btn primary" id="copyComplaint">Copy complaint</button><button class="btn" id="printPack">Print / save PDF</button></div><div id="p1Status" class="context-status"></div>');document.getElementById('copyComplaint').onclick=()=>copyP1(d.complaint);document.getElementById('printPack').onclick=()=>{const w=window.open('','_blank');if(!w)return;w.document.write(d.pack_html);w.document.close();w.focus();setTimeout(()=>w.print(),250)}}catch(e){openP1('<p class="p1-muted">The Dispute Pack could not be prepared right now.</p>')}}async function p1Contact(){try{const d=await loadP1();const msg=encodeURIComponent(d.whatsapp.message+'\nCase details are saved in RecoverIT.');openP1('<h3>Continue with your case</h3><p class="p1-muted">Choose a channel. RecoverIT keeps the source case unchanged.</p><div class="p1-actions"><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/?text='+msg+'">Open WhatsApp</a><button class="btn" id="emailCase">Prepare email</button></div><div id="p1Status" class="context-status"></div><p class="p1-muted" style="margin-top:12px">For email, RecoverIT prepares the case summary in your mail app so you can choose the recipient.</p>');document.getElementById('emailCase').onclick=()=>{location.href='mailto:?subject='+encodeURIComponent('RecoverIT case '+d.case_number)+'&body='+encodeURIComponent(d.complaint)} }catch(e){openP1('<p class="p1-muted">Contact tools are temporarily unavailable.</p>')}}async function p2Monitor(){try{const expected=prompt('When do you expect the refund/payment checkpoint? Use YYYY-MM-DD or leave blank.');const r=await fetch('/api/cases/p2-tools',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({action:'watch_refund',case_id:currentId,expected_at:expected||null})});const d=await r.json();openP1('<h3>Monitoring enabled</h3><p class="p1-muted">'+esc(d.message||'RecoverIT will watch the checkpoint you provided and surface a meaningful update in your account.')+'</p>')}catch(e){openP1('<p class="p1-muted">Monitoring could not be enabled right now. Your existing investigation is unaffected.</p>')}}async function p2Escalate(){try{const r=await fetch('/api/cases/p2-tools',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({action:'prepare_escalation',case_id:currentId})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not prepare escalation');openP1('<h3>Escalation preparation ready</h3><p class="p1-muted">RecoverIT prepared the next formal complaint from the case facts. Review it before sending.</p><textarea class="p1-copy" readonly>'+esc(d.complaint||'')+'</textarea><div class="p1-actions"><button class="btn primary" id="copyEsc">Copy complaint</button></div><div id="p1Status" class="context-status"></div>');document.getElementById('copyEsc').onclick=()=>copyP1(d.complaint||'')}catch(e){openP1('<p class="p1-muted">Escalation preparation is temporarily unavailable. Your existing case remains unchanged.</p>')}}function wireP1(){document.getElementById('p1Provider')?.addEventListener('click',p1Provider);document.getElementById('p1Escalation')?.addEventListener('click',p1Escalation);document.getElementById('p1Pack')?.addEventListener('click',p1Pack);document.getElementById('p1Contact')?.addEventListener('click',p1Contact);document.getElementById('p2Monitor')?.addEventListener('click',p2Monitor);document.getElementById('p2Escalate')?.addEventListener('click',p2Escalate)}
async function refreshResolution(){try{const r=await fetch('/api/cases/resolution-state?case_id='+encodeURIComponent(currentId),{credentials:'include',cache:'no-store'});if(!r.ok)return;const d=await r.json(),s=d.state;if(!s)return;const el=document.getElementById('resolutionStrip');if(!el)return;el.className='resolution-strip '+(s.needs_user?'needs ':'')+(s.resolution_status==='RESOLVED'?'resolved':'');el.innerHTML='<div><span class="resolution-state">'+esc(s.phase.replaceAll('_',' '))+'</span><strong>'+esc(s.next_action)+'</strong><small>'+esc(s.summary||'RecoverIT is following the case.')+'</small></div>'+(s.resolution_status==='RESOLVED'?'<button id="reopenCase">Not resolved</button>':'<button id="resolveCase">Problem solved</button>');document.getElementById('reopenCase')?.addEventListener('click',async()=>{await fetch('/api/cases/resolution-state',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:currentId,action:'reopen'})});await load()});document.getElementById('resolveCase')?.addEventListener('click',async()=>{await fetch('/api/cases/resolution-state',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:currentId,action:'mark_resolved',note:'User confirmed the payment problem is resolved.'})});await load()});}catch(_){}}
async function start(){if(started)return;started=true;const b=document.getElementById('investigate'),m=document.getElementById('msg');if(b){b.disabled=true;b.textContent='Starting investigation…'}if(m)m.textContent='Starting the investigation in the background — this should return quickly.';try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),4000);const r=await fetch('/api/cases/investigate',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:currentId}),signal:ctl.signal});clearTimeout(to);const d=await r.json();if(r.status===401){location.href='/login?next='+encodeURIComponent('/case.html?id='+currentId);return}if(!r.ok)throw Error(d.error||'Could not start investigation.');started=false;await load()}catch(e){started=false;if(m)m.textContent=e.name==='AbortError'?'The start request is taking too long. The investigation service is not responding yet.':e.message;if(b){b.disabled=false;b.textContent='Retry investigation'}}}
 load();timer=setInterval(()=>{const contextOpen=document.getElementById('contextModal')?.classList.contains('open');if(!document.hidden&&!started&&!contextOpen)load()},5000);window.addEventListener('beforeunload',()=>clearInterval(timer));
})();
