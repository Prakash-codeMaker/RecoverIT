<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecoverIT Investigation</title><link rel="stylesheet" href="/theme.css"><style>body{background:#07090b}.livewrap{max-width:1180px;margin:50px auto;padding:0 24px}.loading{min-height:55vh;display:grid;place-items:center}.loadcard{width:min(680px,100%);padding:32px;border:1px solid #29313a;border-radius:24px;background:#10151a}.spinner{width:24px;height:24px;border:3px solid #2d3540;border-top-color:#b8ff62;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{display:flex;gap:12px;align-items:center}.error{border-color:#65404a}.eyebrow{letter-spacing:.12em;text-transform:uppercase}.muted{color:#94a0af}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.card{background:#10151a;border:1px solid #29313a;border-radius:22px;padding:24px}.step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #242b33}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid #3a444f;flex:none}.running .dot,.done .dot{background:#b8ff62;color:#071007}.pill{display:inline-flex;padding:8px 12px;border:1px solid #35404a;border-radius:999px}.guide{margin-top:18px;padding:18px;border-left:3px solid #b8ff62;background:#13191f;border-radius:0 14px 14px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.livewrap{margin-top:25px}}</style></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="actions"><a class="btn" href="/app.html">Dashboard</a><a class="btn primary" href="/report.html">New case</a></div></nav><main id="root" class="livewrap"><div class="loading"><div class="loadcard"><div class="status"><div class="spinner"></div><div><h2 style="margin:0">Opening your case…</h2><p class="muted" id="loadmsg">Getting the latest case status.</p></div></div><div class="muted" style="margin-top:20px;font-size:13px">This should take only a moment.</div></div></div></main></div><script>
(function(){
 const params=new URLSearchParams(location.search),requested=params.get('id'),root=document.getElementById('root');let currentId=requested,started=false,timer=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const st=s=>String(s||'').replaceAll('_',' '); const money=v=>Number(v)?'₹'+Number(v).toLocaleString('en-IN'):'Amount pending';
 function showError(title,msg){root.innerHTML='<div class="loading"><div class="loadcard error"><div class="eyebrow">CASE ERROR</div><h1>'+esc(title)+'</h1><p class="muted">'+esc(msg)+'</p><div class="actions" style="margin-top:20px"><a class="btn primary" href="/app.html">Dashboard</a><button class="btn" id="retry">Retry</button></div></div></div>';document.getElementById('retry').onclick=load}
 async function getStatus(id){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),2500);try{const r=await fetch('/api/cases/status?case_id='+encodeURIComponent(id),{credentials:'include',cache:'no-store',signal:ctl.signal});const d=await r.json();return {r,d}}finally{clearTimeout(to)}}
 async function load(){
  if(!currentId){showError('No case selected','Return to the dashboard and open a case.');return}
  const msg=document.getElementById('loadmsg');if(msg)msg.textContent='Connecting to the case service…';
  try{
   let x=await getStatus(currentId);
   if(x.r.status===401){location.href='/login?next='+encodeURIComponent('/case.html?id='+currentId);return}
   if(x.r.status===404){
    if(msg)msg.textContent='That case link is no longer valid. Finding your latest case…';
    const fallback=await getStatus('');
    if(!fallback.r.ok)throw Error('Your session is active, but no case could be found. Return to the dashboard and open the case from there.');
    currentId=fallback.d.case.id;x=fallback;history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(currentId));
   }
   if(!x.r.ok)throw Error(x.d.error||'The case service could not respond.');
   render(x.d);if(!started && (params.get('autostart')==='1'||x.d.case.status==='REPORTED')) start();
  }catch(e){if(e.name==='AbortError')showError('The case service is taking too long','The request did not return within 2.5 seconds. This is a connection/API problem, not the investigation itself.');else showError('We could not open this case',e.message)}
 }
 function render(d){const c=d.case,steps=d.steps||[],events=d.events||[],proof=d.evidence||[];const running=steps.some(s=>s.status==='RUNNING');root.innerHTML='<div class="topline"><div><div class="eyebrow">'+esc(c.case_number)+'</div><h1>Your investigation</h1><p class="muted">'+money(c.amount)+' · '+esc(c.payment_method||'payment')+'</p></div><span class="pill">'+esc(st(c.status))+'</span></div><div class="card" style="margin:20px 0"><b>Live investigation</b><p class="muted" style="margin:7px 0 0">'+(running?'RecoverIT is working through your evidence now.':'Case status is updated. You can start or refresh the investigation.')+'</p></div><div class="grid"><section><div class="card"><div class="eyebrow">WHAT HAPPENED</div><h3>'+esc(st(c.issue_type))+'</h3><p class="muted">'+esc(c.description)+'</p><div class="guide"><b>Your next step</b><p class="muted" id="guidance">'+(proof.length?'Keep your original proof. Do not submit another refund request until the existing payment state is reconciled.':'Upload your payment receipt, bank statement, refund message, or merchant response so RecoverIT can compare evidence.')+'</p></div></div><div class="card" style="margin-top:16px"><div class="eyebrow">TIMELINE</div>'+(events.length?events.map(e=>'<div class="step done"><div class="dot">✓</div><div><b>'+esc(e.title)+'</b><p class="muted">'+esc(e.detail||'')+'</p></div></div>').join(''):'<p class="muted">Investigation events will appear here.</p>')+'</div></section><aside><div class="card"><div class="eyebrow">INVESTIGATION</div>'+steps.map(s=>'<div class="step '+String(s.status).toLowerCase()+'"><div class="dot">'+(s.status==='DONE'?'✓':s.status==='RUNNING'?'●':'○')+'</div><div><b>'+esc(s.title)+'</b><p class="muted" style="font-size:12px">'+esc(s.status)+(s.detail?' · '+esc(s.detail).slice(0,180):'')+'</p></div></div>').join('')+'<button class="btn primary" id="investigate" style="width:100%;justify-content:center;margin-top:18px">'+(running?'Investigation running…':'Start / refresh investigation')+'</button><p id="msg" class="muted" style="font-size:12px"></p></div><div class="card" style="margin-top:16px"><div class="eyebrow">EVIDENCE</div><p class="muted">'+(proof.length?proof.length+' proof file(s) attached.':'No proof attached yet.')+'</p><div class="pill">Consistency: '+(c.confidence_score==null?'Not assessed':esc(c.confidence_score)+'%')+'</div><p class="muted" style="font-size:12px">Consistency is not the same as proving a document authentic.</p></div></aside></div>';document.getElementById('investigate').onclick=start}
 async function start(){if(started)return;started=true;const b=document.getElementById('investigate'),m=document.getElementById('msg');if(b){b.disabled=true;b.textContent='Starting investigation…'}if(m)m.textContent='Starting the investigation in the background — this should return quickly.';try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),4000);const r=await fetch('/api/cases/investigate',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:currentId}),signal:ctl.signal});clearTimeout(to);const d=await r.json();if(r.status===401){location.href='/login?next='+encodeURIComponent('/case.html?id='+currentId);return}if(!r.ok)throw Error(d.error||'Could not start investigation.');started=false;await load()}catch(e){started=false;if(m)m.textContent=e.name==='AbortError'?'The start request is taking too long. The investigation service is not responding yet.':e.message;if(b){b.disabled=false;b.textContent='Retry investigation'}}}
 load();timer=setInterval(()=>{if(!document.hidden&&!started)load()},5000);window.addEventListener('beforeunload',()=>clearInterval(timer));
})();
</script></body></html>
