<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">RecoverIT case state machine</title><desc id="d">Detailed state transitions for identity, evidence, investigation, route preparation, approval, external response and resolution.</desc>
<rect width="1200" height="720" rx="28" fill="#080a0c"/>
<text x="50" y="58" fill="#b9f36b" font-family="monospace" font-size="15" letter-spacing="3">CASE STATE MACHINE</text>
<text x="50" y="98" fill="#f4f5f2" font-family="Arial, sans-serif" font-size="29" font-weight="700">The product is a state machine, not a chat transcript.</text>
<g font-family="Arial, sans-serif" font-size="16">
  <g><rect x="55" y="145" width="185" height="75" rx="18" fill="#111719" stroke="#38454a"/><text x="147" y="176" text-anchor="middle" fill="#f4f5f2" font-weight="700">IDENTITY</text><text x="147" y="201" text-anchor="middle" fill="#7f8a8c" font-size="12">verify owner</text></g>
  <g><rect x="292" y="145" width="185" height="75" rx="18" fill="#111719" stroke="#b9f36b"/><text x="384" y="176" text-anchor="middle" fill="#f4f5f2" font-weight="700">EVIDENCE</text><text x="384" y="201" text-anchor="middle" fill="#b9f36b" font-size="12">verify proof</text></g>
  <g><rect x="529" y="145" width="185" height="75" rx="18" fill="#111719" stroke="#38454a"/><text x="621" y="176" text-anchor="middle" fill="#f4f5f2" font-weight="700">INVESTIGATION</text><text x="621" y="201" text-anchor="middle" fill="#7f8a8c" font-size="12">reconstruct facts</text></g>
  <g><rect x="766" y="145" width="185" height="75" rx="18" fill="#111719" stroke="#38454a"/><text x="858" y="176" text-anchor="middle" fill="#f4f5f2" font-weight="700">ROUTE</text><text x="858" y="201" text-anchor="middle" fill="#7f8a8c" font-size="12">prepare recovery</text></g>
  <g><rect x="1003" y="145" width="140" height="75" rx="18" fill="#111719" stroke="#b9f36b"/><text x="1073" y="176" text-anchor="middle" fill="#f4f5f2" font-weight="700">APPROVAL</text><text x="1073" y="201" text-anchor="middle" fill="#b9f36b" font-size="12">human gate</text></g>
  <path d="M240 182 H292 M477 182 H529 M714 182 H766 M951 182 H1003" stroke="#65727a" stroke-width="2"/><path d="M276 176 l16 6 l-16 6 M513 176 l16 6 l-16 6 M750 176 l16 6 l-16 6 M987 176 l16 6 l-16 6" fill="#65727a"/>
  <g><rect x="280" y="300" width="270" height="94" rx="18" fill="#101616" stroke="#4f5f65"/><text x="415" y="336" text-anchor="middle" fill="#f4f5f2" font-weight="700">WAITING FOR USER</text><text x="415" y="361" text-anchor="middle" fill="#7f8a8c" font-size="12">missing proof / action / authorization</text><path d="M384 220 V300" stroke="#65727a" stroke-width="2"/></g>
  <g><rect x="625" y="300" width="270" height="94" rx="18" fill="#101616" stroke="#4f5f65"/><text x="760" y="336" text-anchor="middle" fill="#f4f5f2" font-weight="700">WAITING FOR AUTOMATION</text><text x="760" y="361" text-anchor="middle" fill="#7f8a8c" font-size="12">AI/provider unavailable · retry armed</text><path d="M621 220 V300" stroke="#65727a" stroke-width="2"/></g>
  <g><rect x="398" y="486" width="405" height="94" rx="18" fill="#111a12" stroke="#b9f36b" stroke-width="2"/><text x="600" y="522" text-anchor="middle" fill="#f4f5f2" font-weight="700">EXTERNAL RESPONSE / MONITORING</text><text x="600" y="548" text-anchor="middle" fill="#7f8a8c" font-size="12">provider response → follow-up → escalation → outcome</text><path d="M1073 220 V486 H803" stroke="#65727a" stroke-width="2" fill="none"/>
    <path d="M398 533 H310 V182 H292" stroke="#65727a" stroke-width="2" fill="none" stroke-dasharray="7 6"/></g>
  <g><rect x="895" y="486" width="248" height="94" rx="18" fill="#111a12" stroke="#b9f36b"/><text x="1019" y="522" text-anchor="middle" fill="#f4f5f2" font-weight="700">RESOLVED</text><text x="1019" y="548" text-anchor="middle" fill="#b9f36b" font-size="12">outcome confirmed</text><path d="M803 533 H895" stroke="#b9f36b" stroke-width="2"/></g>
</g>
