<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" rx="36" fill="#0b0f12"/><g font-family="Inter,Arial,sans-serif" fill="#edf3f1"><text x="70" y="72" font-size="18" fill="#b9f36b" letter-spacing="3">RECOVERIT · JUDGE DEMO SCENARIO</text><text x="70" y="114" font-size="40" font-weight="800">₹18,500 refund dispute — from messy story to bounded action.</text><text x="70" y="146" font-size="17" fill="#91a0a5">A single concrete case is enough to understand the product and the engineering underneath it.</text><g transform="translate(70 200)"><rect width="1300" height="500" rx="28" fill="#10171b" stroke="#303b43"/><g transform="translate(30 30)"><rect width="1240" height="72" rx="18" fill="#131c20" stroke="#38464e"/><text x="24" y="28" font-size="11" fill="#7f8c92" letter-spacing="2">CASE RX-10482</text><text x="24" y="54" font-size="18" font-weight="800">Merchant says refund processed · user says money never arrived</text><text x="1100" y="43" font-size="13" fill="#b9f36b">₹18,500</text></g><g transform="translate(30 130)"><g><rect width="180" height="105" rx="18" fill="#162118" stroke="#4e6944"/><text x="90" y="34" text-anchor="middle" font-size="12" fill="#b9f36b">01</text><text x="90" y="62" text-anchor="middle" font-size="17" font-weight="800">Evidence</text><text x="90" y="84" text-anchor="middle" font-size="11" fill="#91a0a5">3 files attached</text></g><path d="M187 52H230" stroke="#5b686e" stroke-width="3"/><g transform="translate(237)"><rect width="180" height="105" rx="18" fill="#162118" stroke="#4e6944"/><text x="90" y="34" text-anchor="middle" font-size="12" fill="#b9f36b">02</text><text x="90" y="62" text-anchor="middle" font-size="17" font-weight="800">Verified</text><text x="90" y="84" text-anchor="middle" font-size="11" fill="#91a0a5">payment facts supported</text></g><path d="M424 52H467" stroke="#5b686e" stroke-width="3"/><g transform="translate(474)"><rect width="180" height="105" rx="18" fill="#162118" stroke="#4e6944"/><text x="90" y="34" text-anchor="middle" font-size="12" fill="#b9f36b">03</text><text x="90" y="62" text-anchor="middle" font-size="17" font-weight="800">Investigate</text><text x="90" y="84" text-anchor="middle" font-size="11" fill="#91a0a5">timeline reconciled</text></g><path d="M661 52H704" stroke="#5b686e" stroke-width="3"/><g transform="translate(711)"><rect width="180" height="105" rx="18" fill="#162118" stroke="#4e6944"/><text x="90" y="34" text-anchor="middle" font-size="12" fill="#b9f36b">04</text><text x="90" y="62" text-anchor="middle" font-size="17" font-weight="800">Route</text><text x="90" y="84" text-anchor="middle" font-size="11" fill="#91a0a5">legitimate organization</text></g><path d="M898 52H941" stroke="#5b686e" stroke-width="3"/><g transform="translate(948)"><rect width="180" height="105" rx="18" fill="#18231a" stroke="#b9f36b"/><text x="90" y="34" text-anchor="middle" font-size="12" fill="#b9f36b">05</text><text x="90" y="62" text-anchor="middle" font-size="17" font-weight="800">Approve</text><text x="90" y="84" text-anchor="middle" font-size="11" fill="#91a0a5">user authorizes contact</text></g></g><g transform="translate(30 285)"><rect width="600" height="170" rx="22" fill="#0d1418" stroke="#303b43"/><text x="24" y="34" font-size="12" fill="#7f8c92" letter-spacing="2">WHAT THE AI DOES</text><text x="24" y="69" font-size="15" fill="#c9d3d6">Reads the story + evidence, extracts facts,</text><text x="24" y="95" font-size="15" fill="#c9d3d6">finds missing or conflicting information,</text><text x="24" y="121" font-size="15" fill="#c9d3d6">interprets provider replies, prepares a route.</text></g><g transform="translate(650 285)"><rect width="590" height="170" rx="22" fill="#11191b" stroke="#4b6540"/><text x="24" y="34" font-size="12" fill="#b9f36b" letter-spacing="2">WHAT THE SYSTEM ENFORCES</text><text x="24" y="69" font-size="15" fill="#c9d3d6">No verified evidence → no external contact.</text><text x="24" y="95" font-size="15" fill="#c9d3d6">No legitimate route → no send.</text><text x="24" y="121" font-size="15" fill="#c9d3d6">No user approval → no consequential action.</text></g></g><text x="70" y="760" font-size="15" fill="#718087">The demo shows the product promise, while the repository explains the engineering that makes the promise safe.</text></g></svg>