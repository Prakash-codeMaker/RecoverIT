<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680"><rect width="1440" height="680" rx="36" fill="#0b0f12"/><g font-family="Inter,Arial,sans-serif" fill="#edf3f1"><text x="72" y="74" font-size="18" fill="#b9f36b" letter-spacing="3">RECOVERIT · PRODUCT → COMPANY</text><text x="72" y="116" font-size="40" font-weight="800">Start with a payment problem. Build a resolution network.</text><text x="72" y="148" font-size="17" fill="#91a0a5">The company opportunity compounds as more payment contexts become machine-readable and routable.</text><g transform="translate(90 220)"><circle cx="630" cy="190" r="122" fill="#11191b" stroke="#4e6645" stroke-width="2"/><text x="630" y="177" text-anchor="middle" font-size="31" font-weight="800">RecoverIT</text><text x="630" y="208" text-anchor="middle" font-size="15" fill="#9aa6aa">resolution layer</text><g transform="translate(520 62)"><rect width="220" height="62" rx="18" fill="#121a1f" stroke="#38454d"/><text x="110" y="27" text-anchor="middle" font-size="14" fill="#b9f36b">01 · USERS</text><text x="110" y="48" text-anchor="middle" font-size="12" fill="#9aa6aa">payment problems</text></g><g transform="translate(120 142)"><rect width="220" height="62" rx="18" fill="#121a1f" stroke="#38454d"/><text x="110" y="27" text-anchor="middle" font-size="14" fill="#b9f36b">02 · PROVIDERS</text><text x="110" y="48" text-anchor="middle" font-size="12" fill="#9aa6aa">merchants, gateways, banks</text></g><g transform="translate(920 142)"><rect width="220" height="62" rx="18" fill="#121a1f" stroke="#38454d"/><text x="110" y="27" text-anchor="middle" font-size="14" fill="#b9f36b">03 · WORKFLOWS</text><text x="110" y="48" text-anchor="middle" font-size="12" fill="#9aa6aa">playbooks + route intelligence</text></g><g transform="translate(270 340)"><rect width="220" height="62" rx="18" fill="#121a1f" stroke="#38454d"/><text x="110" y="27" text-anchor="middle" font-size="14" fill="#b9f36b">04 · OUTCOMES</text><text x="110" y="48" text-anchor="middle" font-size="12" fill="#9aa6aa">responses + resolution signals</text></g><g transform="translate(770 340)"><rect width="220" height="62" rx="18" fill="#121a1f" stroke="#38454d"/><text x="110" y="27" text-anchor="middle" font-size="14" fill="#b9f36b">05 · SCALE</text><text x="110" y="48" text-anchor="middle" font-size="12" fill="#9aa6aa">provider coverage + automation</text></g><g stroke="#56636a" stroke-width="3" fill="none"><path d="M630 124V88"/><path d="M520 190H340"/><path d="M740 190H920"/><path d="M560 305L430 340"/><path d="M700 305L850 340"/></g></g><text x="72" y="610" font-size="15" fill="#718087">Company thesis: recover value by making fragmented payment-resolution work executable, measurable and continuously improving.</text></g></svg>