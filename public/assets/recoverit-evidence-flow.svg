<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">RecoverIT evidence flow</title><desc id="d">Evidence flows from upload through multimodal analysis, verification, case facts and route preparation.</desc><defs><style><![CDATA[.bg{fill:#080a0c}.card{fill:#111719;stroke:#334046}.live{fill:#111a12;stroke:#b9f36b}.txt{fill:#f4f5f2;font:700 19px Arial}.small{fill:#899596;font:12px Arial}.ey{fill:#b9f36b;font:11px monospace;letter-spacing:3px}.line{stroke:#47555c;stroke-width:2}.stream{stroke:#b9f36b;stroke-width:3;stroke-dasharray:8 16;animation:flow 2.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-72}}]]></style></defs><rect class="bg" width="1200" height="470" rx="28"/><text x="56" y="54" class="ey">EVIDENCE → FACTS → ACTION</text><text x="56" y="92" class="txt" font-size="30">Every consequential step starts with a verified evidence trail.</text><g transform="translate(55 160)"><rect class="card" width="190" height="150" rx="22"/><text class="ey" x="20" y="35">01</text><text class="txt" x="20" y="72">UPLOAD</text><text class="small" x="20" y="101">receipt · statement</text><text class="small" x="20" y="123">refund · screenshot</text></g><g transform="translate(300 160)"><rect class="card" width="190" height="150" rx="22"/><text class="ey" x="20" y="35">02</text><text class="txt" x="20" y="72">ANALYZE</text><text class="small" x="20" y="101">OCR / vision</text><text class="small" x="20" y="123">structured extraction</text></g><g transform="translate(545 160)"><rect class="live" width="190" height="150" rx="22"/><text class="ey" x="20" y="35">03</text><text class="txt" x="20" y="72">VERIFY</text><text class="small" x="20" y="101">relevance + confidence</text><text class="small" x="20" y="123">hard gate</text></g><g transform="translate(790 160)"><rect class="card" width="190" height="150" rx="22"/><text class="ey" x="20" y="35">04</text><text class="txt" x="20" y="72">RECONSTRUCT</text><text class="small" x="20" y="101">payment timeline</text><text class="small" x="20" y="123">known / unknown</text></g><g transform="translate(1035 160)"><rect class="live" width="110" height="150" rx="22"/><text class="ey" x="20" y="35">05</text><text class="txt" x="20" y="72">ROUTE</text><text class="small" x="20" y="101">legitimate</text><text class="small" x="20" y="123">next step</text></g><path class="line" d="M245 235 H300 M490 235 H545 M735 235 H790 M980 235 H1035"/><path class="stream" d="M245 235 H300 M490 235 H545 M735 235 H790 M980 235 H1035"/><text x="56" y="370" class="small">If verification fails or the verifier is unavailable, the case remains blocked or waiting — it does not silently advance.</text><text x="56" y="400" class="small">The evidence layer is persistent, auditable, and attached to the same durable case workflow.</text></svg>