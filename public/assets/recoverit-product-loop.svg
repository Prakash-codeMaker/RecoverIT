<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">RecoverIT product loop</title><desc id="d">Animated payment recovery loop from report through resolution and back into continued monitoring.</desc><defs><style><![CDATA[.bg{fill:#080a0c}.card{fill:#111719;stroke:#344047}.live{fill:#111a12;stroke:#b9f36b}.txt{fill:#f4f5f2;font:700 21px Arial}.sub{fill:#839092;font:12px monospace;letter-spacing:.06em}.ey{fill:#b9f36b;font:11px monospace;letter-spacing:3px}.line{stroke:#4c5a60;stroke-width:2;fill:none}.glow{stroke:#b9f36b;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:10 18;animation:move 3.2s linear infinite}.dot{fill:#b9f36b;filter:url(#blur);animation:pulse 1.9s ease-in-out infinite}.n{font:500 13px monospace;fill:#788688}.rule{stroke:#283338;stroke-width:1}@keyframes move{to{stroke-dashoffset:-84}}@keyframes pulse{0%,100%{r:4;opacity:.7}50%{r:8;opacity:1}}]]></style><filter id="blur"><feGaussianBlur stdDeviation="4"/></filter></defs><rect class="bg" width="1200" height="500" rx="30"/><text x="58" y="56" class="ey">THE PRODUCT LOOP</text><text x="58" y="94" class="txt" font-size="32">One payment problem becomes one living case.</text><path class="line" d="M156 220 H1044 M1044 220 C1044 360 885 415 770 415 H420 C305 415 156 350 156 220"/><path class="glow" d="M156 220 H1044 M1044 220 C1044 360 885 415 770 415 H420 C305 415 156 350 156 220"/><circle class="dot" cx="235" cy="220" r="5"/><g transform="translate(70 175)"><rect class="card" width="170" height="90" rx="20"/><text class="n" x="18" y="27">01</text><text class="txt" x="18" y="55">REPORT</text><text class="sub" x="18" y="75">story → case</text></g><g transform="translate(255 175)"><rect class="card" width="170" height="90" rx="20"/><text class="n" x="18" y="27">02</text><text class="txt" x="18" y="55">VERIFY</text><text class="sub" x="18" y="75">evidence</text></g><g transform="translate(440 175)"><rect class="card" width="170" height="90" rx="20"/><text class="n" x="18" y="27">03</text><text class="txt" x="18" y="55">INVESTIGATE</text><text class="sub" x="18" y="75">facts + timeline</text></g><g transform="translate(625 175)"><rect class="card" width="170" height="90" rx="20"/><text class="n" x="18" y="27">04</text><text class="txt" x="18" y="55">RECOVER</text><text class="sub" x="18" y="75">route</text></g><g transform="translate(810 175)"><rect class="live" width="170" height="90" rx="20"/><text class="n" x="18" y="27">05</text><text class="txt" x="18" y="55">APPROVE</text><text class="sub" x="18" y="75" fill="#b9f36b">human gate</text></g><g transform="translate(510 335)"><rect class="live" width="180" height="80" rx="20"/><text class="txt" x="24" y="38">MONITOR → RESOLVE</text><text class="sub" x="24" y="60">response · follow-up · outcome</text></g><text x="58" y="458" class="sub">PERSISTED BETWEEN SESSIONS · BACKGROUND WORKERS CONTINUE THE CASE</text></svg>