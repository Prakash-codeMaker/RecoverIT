<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" rx="36" fill="#0b0f12"/><g font-family="Inter,Arial,sans-serif" fill="#edf3f1"><text x="70" y="72" font-size="18" fill="#b9f36b" letter-spacing="3">RECOVERIT · AI SAFETY BOUNDARY</text><text x="70" y="116" font-size="40" font-weight="800">AI can interpret uncertainty. Money movement needs policy.</text><text x="70" y="148" font-size="17" fill="#91a0a5">Probabilistic reasoning is separated from deterministic financial controls.</text><g transform="translate(70 205)"><rect width="550" height="390" rx="28" fill="#11191b" stroke="#3e5640"/><text x="30" y="46" font-size="14" fill="#b9f36b" letter-spacing="2">AI REASONING LAYER</text><g font-size="17" fill="#c8d2d5"><text x="30" y="90">• Understand the user's story</text><text x="30" y="130">• Read multimodal evidence</text><text x="30" y="170">• Extract payment facts</text><text x="30" y="210">• Identify missing information</text><text x="30" y="250">• Interpret organization replies</text><text x="30" y="290">• Prepare route/message suggestions</text></g><rect x="30" y="330" width="490" height="28" rx="14" fill="#172318"/><text x="275" y="349" text-anchor="middle" font-size="12" fill="#b9f36b">AI OUTPUT = STRUCTURED INPUT, NOT AUTHORITY</text></g><g transform="translate(820 205)"><rect width="550" height="390" rx="28" fill="#10171b" stroke="#49545c"/><text x="30" y="46" font-size="14" fill="#d8e1e3" letter-spacing="2">DETERMINISTIC CONTROL PLANE</text><g font-size="17" fill="#c8d2d5"><text x="30" y="90">✓ identity and case ownership</text><text x="30" y="130">✓ evidence verification gates</text><text x="30" y="170">✓ amount / reference consistency</text><text x="30" y="210">✓ legitimate destination and channel</text><text x="30" y="250">✓ explicit user authorization</text><text x="30" y="290">✓ idempotency, retries and state</text></g><rect x="30" y="330" width="490" height="28" rx="14" fill="#172318"/><text x="275" y="349" text-anchor="middle" font-size="12" fill="#b9f36b">CONTROL OUTPUT = WHAT RECOVERIT MAY ACTUALLY DO</text></g><path d="M620 390H800" stroke="#b9f36b" stroke-width="5"/><path d="M790 378l22 12-22 12" fill="none" stroke="#b9f36b" stroke-width="5"/><text x="720" y="360" text-anchor="middle" font-size="13" fill="#9ea9ad">bounded handoff</text><text x="70" y="650" font-size="15" fill="#718087">Core product promise: the model never becomes the system of record.</text></g></svg>