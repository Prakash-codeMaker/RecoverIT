<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">RecoverIT agent architecture</title><desc id="d">Architecture separating AI interpretation from deterministic controls and external action.</desc><defs><style><![CDATA[.bg{fill:#080a0c}.box{fill:#111719;stroke:#334046}.safe{fill:#111a12;stroke:#b9f36b}.txt{fill:#f4f5f2;font:700 20px Arial}.small{fill:#899596;font:12px Arial}.ey{fill:#b9f36b;font:11px monospace;letter-spacing:3px}.line{stroke:#526067;stroke-width:2}.dash{stroke:#b9f36b;stroke-width:2;stroke-dasharray:8 11;animation:dash 2.5s linear infinite}@keyframes dash{to{stroke-dashoffset:-76}}.beam{fill:#b9f36b;opacity:.12;animation:beam 4s ease-in-out infinite}@keyframes beam{0%,100%{opacity:.05}50%{opacity:.22}}]]></style></defs><rect class="bg" width="1200" height="560" rx="30"/><text x="56" y="56" class="ey">AI + CONTROL PLANE</text><text x="56" y="94" class="txt" font-size="31">Probabilistic intelligence. Deterministic authority.</text><rect class="box" x="56" y="150" width="290" height="275" rx="26"/><text class="ey" x="82" y="190">1 · INTERPRET</text><text class="txt" x="82" y="230">AI layer</text><text class="small" x="82" y="265">Understand payment stories</text><text class="small" x="82" y="294">Read multimodal evidence</text><text class="small" x="82" y="323">Extract structured facts</text><text class="small" x="82" y="352">Interpret provider responses</text><text class="small" x="82" y="381">Prepare routes + messages</text><rect class="beam" x="350" y="165" width="20" height="245" rx="10"/><path class="line" d="M346 287 H424"/><rect class="safe" x="424" y="135" width="350" height="305" rx="26"/><text class="ey" x="452" y="175">2 · DECIDE</text><text class="txt" x="452" y="215">Deterministic control plane</text><text class="small" x="452" y="252">Identity + ownership ✓</text><text class="small" x="452" y="281">Evidence + confidence ✓</text><text class="small" x="452" y="310">Transaction + amount ✓</text><text class="small" x="452" y="339">Destination + route ✓</text><text class="small" x="452" y="368">Authorization + idempotency ✓</text><text class="small" x="452" y="397">State + escalation policy ✓</text><rect class="box" x="826" y="150" width="318" height="275" rx="26"/><text class="ey" x="852" y="190">3 · EXECUTE</text><text class="txt" x="852" y="230">External action</text><text class="small" x="852" y="266">Exact destination</text><text class="small" x="852" y="295">Exact evidence bundle</text><text class="small" x="852" y="324">Exact message / handoff</text><text class="small" x="852" y="353">Explicit user approval</text><text class="small" x="852" y="382">Provider response → case loop</text><path class="dash" d="M346 287 H424"/><path class="dash" d="M774 287 H826"/><text x="56" y="490" class="small">AI can recommend the next step. It cannot authorize the consequential step.</text></svg>