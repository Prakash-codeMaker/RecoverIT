<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620"><rect width="1440" height="620" rx="36" fill="#0b0f12"/><g font-family="Inter,Arial,sans-serif" fill="#edf3f1"><text x="70" y="76" font-size="18" fill="#b9f36b" letter-spacing="3">RECOVERIT · DURABLE CASE WORKFLOW</text><text x="70" y="118" font-size="40" font-weight="800">A case keeps moving even when the user leaves.</text><text x="70" y="150" font-size="17" fill="#91a0a5">Every active case has a persisted step, next action, status and reason.</text><g transform="translate(70 210)"><g><rect width="175" height="92" rx="18" fill="#121a1f" stroke="#39464e"/><text x="88" y="37" text-anchor="middle" font-size="16" fill="#87949a">01</text><text x="88" y="66" text-anchor="middle" font-size="17" font-weight="800">Understand</text></g><path d="M180 46H218" stroke="#657179" stroke-width="3"/><g transform="translate(223)"><rect width="175" height="92" rx="18" fill="#121a1f" stroke="#39464e"/><text x="88" y="37" text-anchor="middle" font-size="16" fill="#87949a">02</text><text x="88" y="66" text-anchor="middle" font-size="17" font-weight="800">Verify</text></g><path d="M403 46H441" stroke="#657179" stroke-width="3"/><g transform="translate(446)"><rect width="175" height="92" rx="18" fill="#121a1f" stroke="#39464e"/><text x="88" y="37" text-anchor="middle" font-size="16" fill="#87949a">03</text><text x="88" y="66" text-anchor="middle" font-size="17" font-weight="800">Investigate</text></g><path d="M626 46H664" stroke="#657179" stroke-width="3"/><g transform="translate(669)"><rect width="175" height="92" rx="18" fill="#121a1f" stroke="#39464e"/><text x="88" y="37" text-anchor="middle" font-size="16" fill="#87949a">04</text><text x="88" y="66" text-anchor="middle" font-size="17" font-weight="800">Prepare route</text></g><path d="M849 46H887" stroke="#657179" stroke-width="3"/><g transform="translate(892)"><rect width="175" height="92" rx="18" fill="#162218" stroke="#536b48"/><text x="88" y="37" text-anchor="middle" font-size="16" fill="#b9f36b">05</text><text x="88" y="66" text-anchor="middle" font-size="17" font-weight="800">Approve</text></g><path d="M1072 46H1110" stroke="#657179" stroke-width="3"/><g transform="translate(1115)"><rect width="175" height="92" rx="18" fill="#162218" stroke="#536b48"/><text x="88" y="37" text-anchor="middle" font-size="16" fill="#b9f36b">06</text><text x="88" y="66" text-anchor="middle" font-size="17" font-weight="800">Recover</text></g></g><g transform="translate(70 370)"><rect width="1290" height="150" rx="24" fill="#10171b" stroke="#303b43"/><text x="28" y="40" font-size="13" fill="#7f8c92" letter-spacing="2">PERSISTED AT EVERY STEP</text><g font-size="15"><text x="28" y="76" fill="#d7e0e1">workflow_step</text><text x="245" y="76" fill="#b9f36b">→ exact current stage</text><text x="500" y="76" fill="#d7e0e1">workflow_next_action</text><text x="760" y="76" fill="#b9f36b">→ what can happen next</text><text x="28" y="110" fill="#d7e0e1">workflow_status</text><text x="245" y="110" fill="#b9f36b">→ user / automation / done</text><text x="500" y="110" fill="#d7e0e1">workflow_reason</text><text x="760" y="110" fill="#b9f36b">→ why the case is here</text></g></g><text x="70" y="570" font-size="14" fill="#718087">Browser sessions can disappear. The recovery state cannot.</text></g></svg>