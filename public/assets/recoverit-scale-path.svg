<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">RecoverIT scale path</title><desc id="d">Evolution from one case to a payment resolution network by adding providers, workflows, data and automation.</desc><defs><style><![CDATA[.bg{fill:#080a0c}.card{fill:#111719;stroke:#334046}.live{fill:#111a12;stroke:#b9f36b}.txt{fill:#f4f5f2;font:700 19px Arial}.small{fill:#899596;font:12px Arial}.ey{fill:#b9f36b;font:11px monospace;letter-spacing:3px}.line{stroke:#46545b;stroke-width:2}.grow{stroke:#b9f36b;stroke-width:3;stroke-dasharray:10 16;animation:g 2.4s linear infinite}@keyframes g{to{stroke-dashoffset:-78}}]]></style></defs><rect class="bg" width="1200" height="430" rx="28"/><text x="56" y="54" class="ey">FROM PRODUCT → COMPANY</text><text x="56" y="92" class="txt" font-size="30">The scaling unit is the recovery workflow, not the chat.</text><g transform="translate(55 155)"><rect class="live" width="200" height="145" rx="22"/><text class="ey" x="20" y="35">TODAY</text><text class="txt" x="20" y="73">ONE CASE</text><text class="small" x="20" y="103">evidence</text><text class="small" x="20" y="124">route</text></g><g transform="translate(300 155)"><rect class="card" width="200" height="145" rx="22"/><text class="ey" x="20" y="35">NEXT</text><text class="txt" x="20" y="73">MORE PROVIDERS</text><text class="small" x="20" y="103">gateway · bank</text><text class="small" x="20" y="124">UPI · merchant</text></g><g transform="translate(545 155)"><rect class="card" width="200" height="145" rx="22"/><text class="ey" x="20" y="35">THEN</text><text class="txt" x="20" y="73">MORE CASES</text><text class="small" x="20" y="103">persistent workers</text><text class="small" x="20" y="124">operational coverage</text></g><g transform="translate(790 155)"><rect class="card" width="200" height="145" rx="22"/><text class="ey" x="20" y="35">COMPOUND</text><text class="txt" x="20" y="73">OUTCOME DATA</text><text class="small" x="20" y="103">successful routes</text><text class="small" x="20" y="124">failure signals</text></g><g transform="translate(1035 155)"><rect class="live" width="110" height="145" rx="22"/><text class="ey" x="20" y="35">GOAL</text><text class="txt" x="20" y="73">NETWORK</text><text class="small" x="20" y="103">coverage</text><text class="small" x="20" y="124">compounds</text></g><path class="line" d="M255 228 H300 M500 228 H545 M745 228 H790 M990 228 H1035"/><path class="grow" d="M255 228 H300 M500 228 H545 M745 228 H790 M990 228 H1035"/><text x="56" y="360" class="small">Same case engine. New provider adapters. New recovery playbooks. More outcomes to learn from.</text></svg>