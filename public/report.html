<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a payment issue · RecoverIT</title><link rel="stylesheet" href="/theme.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><a class="btn" href="/app.html">Dashboard</a></nav><main class="form"><div class="eyebrow">STEP 1 · TELL US WHAT HAPPENED</div><h1 style="font-size:48px;letter-spacing:-.06em">What happened?</h1><p class="muted">Choose the closest match, then describe it in your own words. You stay in control of what RecoverIT understands.</p><div id="flow"></div></main></div><script>
let issue='refund_not_received',amount='',merchant='',ref='',method='UPI',description='';const labels={refund_not_received:'Refund hasn’t arrived',payment_failed_deducted:'Payment failed but money was deducted',duplicate_payment:'I was charged twice',payment_stuck:'Payment is stuck',payment_reversed:'Payment was reversed',unrecognized_payment:"I don't recognize this payment",other:'Something else'};const choices=Object.entries(labels);function render(){document.getElementById('flow').innerHTML=`<div class="choice-grid">${choices.map(([k,v])=>`<button class="choice ${issue===k?'active':''}" data-k="${k}">${v}</button>`).join('')}</div><div class="field"><label>Explain it naturally</label><textarea id="desc" placeholder="My payment of ₹2499 went through but the order failed and the merchant says they refunded me.">${description}</textarea></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Amount (₹)</label><input id="amount" type="number" min="0" value="${amount}" placeholder="2499"></div><div class="field"><label>Payment method</label><select id="method"><option>UPI</option><option>Card</option><option>Netbanking</option><option>Wallet</option><option>Unknown</option></select></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Merchant (optional)</label><input id="merchant" value="${merchant}" placeholder="Merchant name"></div><div class="field"><label>Transaction reference (optional)</label><input id="ref" value="${ref}" placeholder="UPI / gateway reference"></div></div><div class="notice">Voice input is supported as a progressive enhancement; if microphone access is unavailable, text remains the reliable fallback.</div><button class="btn primary" id="continue">Show me what RecoverIT understood →</button>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{issue=b.dataset.k;render()});document.getElementById('desc').oninput=e=>description=e.target.value;document.getElementById('amount').oninput=e=>amount=e.target.value;document.getElementById('merchant').oninput=e=>merchant=e.target.value;document.getElementById('ref').oninput=e=>ref=e.target.value;document.getElementById('method').value=method;document.getElementById('method').onchange=e=>method=e.target.value;document.getElementById('continue').onclick=confirm}
function confirm(){if(!description||!amount)return alert('Please describe the issue and enter the amount.');document.getElementById('flow').innerHTML=`<div class="card"><div class="eyebrow">RECOVERIT UNDERSTOOD</div><h2>Here’s what we heard.</h2><div class="detail"><div><span>Issue</span><b>${labels[issue]}</b></div><div><span>Amount</span><b>₹${Number(amount).toLocaleString('en-IN')}</b></div><div><span>Merchant</span><b>${merchant||'Not provided'}</b></div><div><span>Reference</span><b>${ref||'Not provided'}</b></div><div><span>Method</span><b>${method}</b></div></div><p class="muted">We will not silently submit AI interpretation. Confirm these details before creating the case.</p><div class="actions"><button class="btn primary" id="submit">Confirm & create case</button><button class="btn" id="edit">Edit</button></div></div>`;document.getElementById('edit').onclick=render;document.getElementById('submit').onclick=async()=>{const r=await fetch('/api/cases/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({issue_type:issue,description,amount,merchant_name:merchant,transaction_reference:ref,payment_method:method})});const d=await r.json();if(r.ok)location.href='/case.html?id='+d.id;else alert(d.error||'Could not create case.')};}render();</script></body></html>
