<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecoverIT — Payment recovery, handled.</title><link rel="stylesheet" href="/theme.css"><script src="/vendor/react.js"></script><script src="/vendor/react-dom.js"></script><script src="/vendor/htm.js"></script></head><body><div id="root"></div><script>
const h=htm.bind(React.createElement);const {useEffect,useState}=React;
function Nav({signed=false}){return h`<nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a><div class="navlinks"><a href="#how">How it works</a><a href="#protection">Protection</a><a href="/test-mode.html">Test Mode</a></div>${signed?h`<a class="btn" href="/app.html">Open dashboard</a>`:h`<a class="btn primary" href="/login">Get started</a>`}</nav>`}
function Hero(){return h`<section class="hero"><div><div class="eyebrow">PAYMENT RECOVERY, REIMAGINED</div><h1>Payment went wrong?<br/><span style="color:#b9f36b">RecoverIT takes it from here.</span></h1><p>RecoverIT investigates payment and refund problems, reconstructs what happened, finds the safest next step, and keeps you updated until the issue is resolved.</p><div class="actions"><a class="btn primary" href="/report.html">Resolve a payment issue →</a><a class="btn ghost" href="#how">See how it works</a></div></div><div class="visual"><div class="orbit"></div><div class="orbit two"></div><div class="node n1">Payment<br/><b>₹2,499</b></div><div class="node n2">Provider<br/><b>checking</b></div><div class="node n3">Refund<br/><b>pending</b></div><div class="node n4">Timeline<br/><b>rebuilding</b></div><div class="core"><div><strong>RecoverIT</strong><br/><small>investigating</small></div></div><div class="status">SAFE PATH FOUND · TRACKING</div></div></section>`}
function Story(){const cards=[['01','Something went wrong.','A payment succeeds, an order fails, or a refund disappears into the gap.'],['02','Something doesn’t match.','Merchant, gateway and payment evidence can disagree. RecoverIT keeps uncertainty visible.'],['03','We reconstruct what happened.','Events are normalized into one payment timeline so the case has a defensible story.'],['04','We decide what is safe.','AI can investigate and explain. Deterministic policy owns money movement.'],['05','We stop duplicate actions.','The Action Ledger makes money-adjacent actions idempotent and concurrency-safe.'],['06','You only hear when it matters.','RecoverIT tracks the case and surfaces the next useful thing instead of making you chase it.']];return h`<section class="section" id="how"><div class="story"><div class="sticky"><div class="eyebrow">FROM PROBLEM TO RESOLUTION</div><h2>One problem.<br/>One clear story.</h2><p class="muted">The interface stays calm while the investigation underneath handles the complexity.</p></div><div class="story-list">${cards.map(c=>h`<article class="story-card"><div class="num">${c[0]}</div><h3>${c[1]}</h3><p class="muted">${c[2]}</p></article>`)}</div></div></section>`}
function Protection(){return h`<section class="section" id="protection"><div class="center"><div class="eyebrow">THE KILLER MOMENT</div><h2>AI investigates.<br/><span style="color:#b9f36b">Rules protect your money.</span></h2><p class="muted">A matching refund already exists. A second refund request arrives. The ledger wins.</p></div><div style="height:35px"></div><div class="diagram"><div>Existing<br/>refund</div><b>→</b><div>Action<br/>Ledger</div><b>→</b><div>DUPLICATE<br/><strong style="color:#b9f36b">BLOCKED</strong></div></div></section>`}
function Footer(){return h`<footer class="footer"><div class="shell" style="display:flex;justify-content:space-between;gap:20px"><span>RecoverIT · Payment recovery, handled.</span><span>TEST MODE protects the demo from real money movement.</span></div></footer>`}
function App(){return h`<><div class="shell"><${Nav}/><${Hero}/><${Story}/><${Protection}/></div><${Footer}/></>`}ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
