<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · RecoverIT</title><link rel="stylesheet" href="/theme.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">RecoverIT<i></i></a></nav><main class="appmain"><div class="eyebrow">OPERATIONS</div><h1>RecoverIT Admin</h1><p class="muted">Real database analytics only. No fabricated counts.</p><div id="stats" class="grid"></div></main></div><script>fetch('/api/admin/analytics').then(r=>r.json()).then(d=>{if(!d.cases_by_status){document.getElementById('stats').innerHTML='<div class="notice">Admin access required.</div>';return}document.getElementById('stats').innerHTML=d.cases_by_status.map(x=>`<div class="stat"><span>${x.status}</span><strong>${x.count}</strong></div>`).join('')+`<div class="stat"><span>Test / protected actions</span><strong>${d.duplicate_or_test_actions}</strong></div>`})</script><script src="/motion.js"></script></body></html>
